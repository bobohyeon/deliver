const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('screens').innerHTML=screens.map(s=>`<section class="page"><header class="screen-head"><div class="screen-title"><span class="screen-id">${s.id}</span><h2>${escapeHtml(s.name)}</h2></div><div class="screen-meta">경로&nbsp;&nbsp;${escapeHtml(s.route)}<br>접근&nbsp;&nbsp;${escapeHtml(s.access)}</div></header><div class="screen-body"><figure class="screen-figure"><img src="${s.img}" alt="${escapeHtml(s.name)}"></figure><aside class="index-panel"><h3>화면 구성</h3><table class="index-table"><thead><tr><th>번호</th><th>구성요소</th><th>역할</th></tr></thead><tbody>${s.rows.map(r=>`<tr><td>${r[0]}</td><td>${escapeHtml(r[1])}</td><td>${escapeHtml(r[2])}</td></tr>`).join('')}</tbody></table></aside></div><span class="page-number"></span></section>`).join('');
window.__svgReady=(async()=>{
  const fontResponse=await fetch('포트폴리오/NotoSansKR.ttf');
  if(!fontResponse.ok) throw new Error('한글 글꼴 로드 실패');
  const svgFont=new FontFace('Tasqra SVG Korean',await fontResponse.arrayBuffer(),{weight:'100 900'});
  await svgFont.load();
  document.fonts.add(svgFont);
  await Promise.all([...document.querySelectorAll('img[src$=".svg"]')].map(async image=>{
    const response=await fetch(image.src);
    if(!response.ok) throw new Error(`SVG 로드 실패: ${image.src}`);
    const source=await response.text();
    const parsed=new DOMParser().parseFromString(source,'image/svg+xml');
    const svg=document.importNode(parsed.documentElement,true);
    svg.querySelectorAll('style').forEach(style=>{style.textContent=style.textContent.replace(/@font-face\{[^}]+\}/g,'')});
    svg.querySelectorAll('text').forEach(text=>{text.style.fontFamily='Tasqra SVG Korean'});
    svg.removeAttribute('width');
    svg.removeAttribute('height');
    svg.setAttribute('aria-label',image.alt);
    image.replaceWith(svg);
  }));
  await document.fonts.ready;
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  document.querySelectorAll('.page svg').forEach(svg=>{
    const host=svg.parentElement;
    const hostStyle=getComputedStyle(host);
    if(hostStyle.position==='static') host.style.position='relative';
    const hostRect=host.getBoundingClientRect();
    const layer=document.createElement('div');
    layer.className='svg-text-layer';
    [...svg.querySelectorAll('text')].forEach(text=>{
      if(text.closest('.pin')) return;
      const value=text.textContent;
      if(!value) return;
      const matrix=text.getScreenCTM();
      if(!matrix) return;
      const point=svg.createSVGPoint();
      point.x=parseFloat(text.getAttribute('x')||'0');
      point.y=parseFloat(text.getAttribute('y')||'0');
      const screenPoint=point.matrixTransform(matrix);
      const style=getComputedStyle(text);
      const scale=Math.hypot(matrix.a,matrix.b)||1;
      const size=(parseFloat(style.fontSize)||16)*scale;
      const span=document.createElement('span');
      span.className='svg-text-label';
      span.style.fontFamily="'Noto Sans KR'";
      span.textContent=value;
      span.style.left='0px';
      span.style.top='0px';
      span.style.visibility='hidden';
      span.style.fontSize=`${size}px`;
      span.style.fontWeight=style.fontWeight;
      span.style.letterSpacing=style.letterSpacing==='normal'?'normal':`${(parseFloat(style.letterSpacing)||0)*scale}px`;
      span.style.color=style.fill;
      layer.appendChild(span);
      const width=span.getBoundingClientRect().width;
      const height=span.getBoundingClientRect().height;
      const left=screenPoint.x-hostRect.left-(style.textAnchor==='middle'?width/2:style.textAnchor==='end'?width:0);
      const top=screenPoint.y-hostRect.top-(style.dominantBaseline==='middle'?height/2:height*.82);
      span.style.left=`${left}px`;
      span.style.top=`${top}px`;
      span.style.visibility='visible';
      text.remove();
    });
    host.appendChild(layer);
  });
  document.documentElement.dataset.svgReady='true';
})();
</script></body></html>
