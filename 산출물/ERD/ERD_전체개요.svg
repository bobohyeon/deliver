<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Tasqra 데이터베이스 전체 개요 ERD</title>
  <desc id="desc">사용자와 프로젝트에서 문서와 OCR, AI 분석과 제안, 태스크와 산출물로 이어지는 핵심 데이터 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      .title{font:700 30px 'IBM Plex Sans','Segoe UI',sans-serif;fill:#111}.sub{font:400 15px 'IBM Plex Sans','Segoe UI',sans-serif;fill:#555}
      .domain{fill:#fafafa;stroke:#222;stroke-width:2}.domainHead{fill:#222}.domainTitle{font:700 20px 'IBM Plex Sans','Segoe UI',sans-serif;fill:#fff}
      .table{fill:#fff;stroke:#888;stroke-width:1.4}.tableText{font:600 16px 'IBM Plex Mono','Consolas',monospace;fill:#222}.note{font:400 13px 'IBM Plex Sans','Segoe UI',sans-serif;fill:#666}
      .flow{fill:none;stroke:#222;stroke-width:2.4;marker-end:url(#arrow)}.scope{fill:none;stroke:#777;stroke-width:1.6;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .labelBg{fill:#fff}.label{font:600 13px 'IBM Plex Sans','Segoe UI',sans-serif;fill:#333}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text class="title" x="50" y="48">Tasqra 데이터베이스 전체 개요</text>
  <text class="sub" x="50" y="76">모든 컬럼은 상세 ERD에 두고, 분야별 핵심 테이블과 검증된 연결 관계만 표시한다.</text>
  <line x1="50" y1="100" x2="1550" y2="100" stroke="#777"/>

  <g transform="translate(50 150)">
    <rect class="domain" width="340" height="680" rx="8"/>
    <path class="domainHead" d="M8 0h324a8 8 0 0 1 8 8v58H0V8a8 8 0 0 1 8-8z"/>
    <text class="domainTitle" x="22" y="40">1. 사용자와 프로젝트</text>
    <rect class="table" x="30" y="105" width="280" height="58" rx="5"/><text class="tableText" x="50" y="141">users</text>
    <rect class="table" x="30" y="190" width="280" height="58" rx="5"/><text class="tableText" x="50" y="226">projects</text>
    <rect class="table" x="30" y="275" width="280" height="58" rx="5"/><text class="tableText" x="50" y="311">project_members</text>
    <rect class="table" x="30" y="360" width="280" height="58" rx="5"/><text class="tableText" x="50" y="396">project_invitations</text>
    <rect class="table" x="30" y="445" width="280" height="58" rx="5"/><text class="tableText" x="50" y="481">refresh_tokens</text>
    <text class="note" x="30" y="550">프로젝트 소유자·구성원·초대와</text><text class="note" x="30" y="574">인증 세션의 기준 영역</text>
  </g>

  <g transform="translate(430 150)">
    <rect class="domain" width="340" height="680" rx="8"/>
    <path class="domainHead" d="M8 0h324a8 8 0 0 1 8 8v58H0V8a8 8 0 0 1 8-8z"/>
    <text class="domainTitle" x="22" y="40">2. 문서와 OCR 검수</text>
    <rect class="table" x="30" y="105" width="280" height="58" rx="5"/><text class="tableText" x="50" y="141">documents</text>
    <rect class="table" x="30" y="190" width="280" height="58" rx="5"/><text class="tableText" x="50" y="226">document_pages</text>
    <rect class="table" x="30" y="275" width="280" height="58" rx="5"/><text class="tableText" x="50" y="311">extracted_texts</text>
    <rect class="table" x="30" y="360" width="280" height="58" rx="5"/><text class="tableText" x="50" y="396">ocr_elements</text>
    <rect class="table" x="30" y="445" width="280" height="58" rx="5"/><text class="tableText" x="50" y="481">document_chunks</text>
    <text class="note" x="30" y="550">원문·페이지·좌표·수정 이력과</text><text class="note" x="30" y="574">검색용 청크를 보존하는 영역</text>
  </g>

  <g transform="translate(810 150)">
    <rect class="domain" width="340" height="680" rx="8"/>
    <path class="domainHead" d="M8 0h324a8 8 0 0 1 8 8v58H0V8a8 8 0 0 1 8-8z"/>
    <text class="domainTitle" x="22" y="40">3. AI 분석과 제안</text>
    <rect class="table" x="30" y="95" width="280" height="52" rx="5"/><text class="tableText" x="50" y="128">analyses</text>
    <rect class="table" x="30" y="164" width="280" height="52" rx="5"/><text class="tableText" x="50" y="197">analysis_jobs</text>
    <rect class="table" x="30" y="233" width="280" height="52" rx="5"/><text class="tableText" x="50" y="266">amount_items</text>
    <rect class="table" x="30" y="302" width="280" height="52" rx="5"/><text class="tableText" x="50" y="335">decisions</text>
    <rect class="table" x="30" y="371" width="280" height="52" rx="5"/><text class="tableText" x="50" y="404">schedule_items</text>
    <rect class="table" x="30" y="440" width="280" height="52" rx="5"/><text class="tableText" x="50" y="473">task_suggestions</text>
    <text class="note" x="30" y="550">분석 실행 이력과 승인 전 추출물·</text><text class="note" x="30" y="574">제안을 관리하는 영역</text>
  </g>

  <g transform="translate(1190 150)">
    <rect class="domain" width="360" height="680" rx="8"/>
    <path class="domainHead" d="M8 0h344a8 8 0 0 1 8 8v58H0V8a8 8 0 0 1 8-8z"/>
    <text class="domainTitle" x="22" y="40">4. 태스크와 산출물</text>
    <rect class="table" x="40" y="145" width="280" height="58" rx="5"/><text class="tableText" x="60" y="181">tasks</text>
    <rect class="table" x="40" y="255" width="280" height="58" rx="5"/><text class="tableText" x="60" y="291">task_activity_logs</text>
    <rect class="table" x="40" y="365" width="280" height="58" rx="5"/><text class="tableText" x="60" y="401">deliverables</text>
    <text class="note" x="40" y="500">승인된 제안 또는 직접 입력으로</text><text class="note" x="40" y="524">태스크를 만들고 결과물을 생성</text>
  </g>

  <path class="flow" d="M390 485 H430"/><rect class="labelBg" x="382" y="448" width="56" height="22"/><text class="label" x="410" y="464" text-anchor="middle">project</text>
  <path class="flow" d="M770 485 H810"/><rect class="labelBg" x="765" y="448" width="50" height="22"/><text class="label" x="790" y="464" text-anchor="middle">document</text>
  <path class="flow" d="M1150 485 H1190"/><rect class="labelBg" x="1145" y="430" width="50" height="42"/><text class="label" x="1170" y="446" text-anchor="middle">제안·</text><text class="label" x="1170" y="463" text-anchor="middle">금액</text>
  <path class="scope" d="M220 830 V880 H1370 V830"/><rect class="labelBg" x="680" y="861" width="240" height="25"/><text class="label" x="800" y="878" text-anchor="middle">projects · users 기준 참조</text>

  <line x1="50" y1="920" x2="1550" y2="920" stroke="#aaa"/>
  <text class="note" x="50" y="950">실선: 주요 처리 흐름 · 점선: 프로젝트/사용자 기준 참조 · 상세 컬럼과 전체 FK는 분야별 상세 ERD 및 코드 대조 페이지 참조</text>
</svg>
