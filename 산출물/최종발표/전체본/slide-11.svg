D315F" stroke="#3A5289" stroke-width="2" opacity="1" /><text x="237" y="808" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">이미 바뀐 문서</text><text x="237" y="846" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#C8D4EC" text-anchor="middle" letter-spacing="0" opacity="1">저장하지 않음</text><rect x="375" y="770" width="225" height="100" rx="16" fill="#1D315F" stroke="#3A5289" stroke-width="2" opacity="1" /><text x="487" y="808" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">여러 곳 수정</text><text x="487" y="846" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#C8D4EC" text-anchor="middle" letter-spacing="0" opacity="1">뒤에서부터 교체</text><rect x="625" y="770" width="225" height="100" rx="16" fill="#1D315F" stroke="#3A5289" stroke-width="2" opacity="1" /><text x="737" y="808" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">문서 버전</text><text x="737" y="846" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#C8D4EC" text-anchor="middle" letter-spacing="0" opacity="1">한 번만 증가</text><rect x="1005" y="680" width="835" height="225" rx="28" fill="#FFFFFF" stroke="#C9E85B" stroke-width="2" opacity="1" filter="url(#softShadow)"/><text x="1050" y="735" font-family="NotoKR, Arial, sans-serif" font-size="23" font-weight="800" font-style="normal" fill="#87A800" text-anchor="start" letter-spacing="0" opacity="1">수정 뒤 검색 자료 다시 준비</text><rect x="1050" y="770" width="225" height="100" rx="16" fill="#F7F9FD" stroke="#DCE5F1" stroke-width="2" opacity="1" /><text x="1162" y="808" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">본문 반영</text><text x="1162" y="846" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" letter-spacing="0" opacity="1">제외·복원 요소</text><rect x="1300" y="770" width="225" height="100" rx="16" fill="#F7F9FD" stroke="#DCE5F1" stroke-width="2" opacity="1" /><text x="1412" y="808" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">검수 확정</text><text x="1412" y="846" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" letter-spacing="0" opacity="1">완료 상태 저장</text><rect x="1550" y="770" width="225" height="100" rx="16" fill="#F7F9FD" stroke="#DCE5F1" stroke-width="2" opacity="1" /><text x="1662" y="808" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">검색 준비</text><text x="1662" y="846" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" letter-spacing="0" opacity="1">문서 나누기·의미 검색</text><text x="960" y="960" font-family="NotoKR, Arial, sans-serif" font-size="21" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">화면에서 고친 내용과 검색에 쓰는 원문을 항상 같게 유지합니다</text></svg>