<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E162F" flood-opacity="0.11"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0E162F" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FC" stroke="none" stroke-width="0" opacity="1" /><text x="80" y="60" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="2" opacity="1">11  /  글자 인식 검수</text><text x="1840" y="60" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="end" letter-spacing="2.6" opacity="0.62">TASQRA</text><line x1="80" y1="1015" x2="1840" y2="1015" stroke="#DCE5F1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1" opacity="1">발표  김보현</text><text x="1840" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="end" letter-spacing="1" opacity="1">담당  최재정</text><text x="80" y="125" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.6" opacity="1">화면과 검색 본문을 함께 수정</text><text x="80" y="195" font-family="NotoKR, Arial, sans-serif" font-size="43" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="-0.8" opacity="1">글자 인식 결과를 고치면 검색용 본문도 함께 고칩니다</text><text x="82" y="245" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">수정 범위, 본문, 뒤 문장의 위치, 문서 버전을 한 번에 바꿔 서로 어긋나지 않게 합니다.</text><rect x="80" y="273" width="118" height="7" rx="4" fill="#315BD8" stroke="none" stroke-width="0" opacity="1" /><rect x="206" y="273" width="24" height="7" rx="4" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><rect x="80" y="300" width="1760" height="335" rx="28" fill="#F8FAFD" stroke="#DCE5F1" stroke-width="2" opacity="1" /><rect x="115" y="325" width="145" height="36" rx="18.0" fill="#E7EEFF" stroke="none" stroke-width="0" opacity="1" /><text x="187.5" y="347.42" font-family="NotoKR, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">미니프로젝트</text><text x="280" y="350" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">엔진 비교 · 좌표 정렬</text><line x1="520" y1="343" x2="600" y2="343" stroke="#9EB0CE" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 585 332 L 600 343 L 585 354" fill="none" stroke="#9EB0CE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="625" y="325" width="145" height="36" rx="18.0" fill="#16234A" stroke="none" stroke-width="0" opacity="1" /><text x="697.5" y="347.42" font-family="NotoKR, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#3BC7F4" text-anchor="middle" letter-spacing="0" opacity="1">본프로젝트</text><text x="790" y="350" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">박스 편집 · 선택 재OCR · 검색 본문 동기화</text><rect x="1510" y="325" width="275" height="38" rx="19.0" fill="#E7EEFF" stroke="none" stroke-width="0" opaci