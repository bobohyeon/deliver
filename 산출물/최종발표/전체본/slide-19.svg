<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E162F" flood-opacity="0.11"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0E162F" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FC" stroke="none" stroke-width="0" opacity="1" /><text x="80" y="60" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="2" opacity="1">19  /  OCR REVIEW</text><text x="1840" y="60" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="end" letter-spacing="2.6" opacity="0.62">TASQRA</text><line x1="80" y1="1015" x2="1840" y2="1015" stroke="#DCE5F1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1" opacity="1">PRESENTER  박세현</text><text x="1840" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="end" letter-spacing="1" opacity="1">OWNER  박세현</text><text x="80" y="125" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.6" opacity="1">TEXT INTEGRITY</text><text x="80" y="195" font-family="NotoKR, Arial, sans-serif" font-size="43" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="-0.8" opacity="1">OCR 박스를 고치면 본문과 오프셋도 함께 바뀝니다</text><text x="82" y="245" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">화면의 수정과 검색 원문이 어긋나지 않도록 범위·버전·revision을 한 트랜잭션에서 갱신합니다.</text><circle cx="105" cy="500" r="74" fill="#FFFFFF" stroke="#315BD8" stroke-width="4" opacity="1" filter="url(#softShadow)"/><text x="105" y="484" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">01</text><text x="105" y="526" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">박스 수정</text><line x1="187" y1="500" x2="313" y2="500" stroke="#A7B8D7" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 298 489 L 313 500 L 298 511" fill="none" stroke="#A7B8D7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="395" cy="500" r="74" fill="#FFFFFF" stroke="#3BC7F4" stroke-width="4" opacity="1" filter="url(#softShadow)"/><text x="395" y="484" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="middle" letter-spacing="0" opacity="1">02</text><text x="395" y="526" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">범위 검증</text><line x1="477" y1="500" x2="603" y2="500" stroke="#A7B8D7" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 588 489 L 603 500 L 588 511" fill="none" stroke="#A7B8D7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="685" cy="500" r="74" fill="#FFFFFF" stroke="#C9E85B" stroke-width="4" opacity="1" filter="url(#softShadow)"/><text x="685" y="484" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#C9E85B" text-anchor="middle" letter-spacing="0" opacity="1">03</text><text x="685" y="526" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">본문 구간 교체</text><line x1="767" y1="500" x2="893" y2="500" stroke="#A7B8D7" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 878 489 L 893 500 L 878 511" fill="none" stroke="#A7B8D7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="975" cy="500" r="74" fill="#FFFFFF" stroke="#5576E8" stroke-width="4" opacity="1" filter="url(#softShadow)"/><text x="975" y="484" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#5576E8" text-anchor="middle" letter-spacing="0" opacity="1">04</text><text x="975" y="526" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">뒤 오프셋 이동</text><line x1="1057" y1="500" x2="1183" y2="500" stroke="#A7B8D7" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 1168 489 L 1183 500 L 1168 511" fill="none" stroke="#A7B8D7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1265" cy="500" r="74" fill="#FFFFFF" stroke="#3BC7F4" stroke-width="4" opacity="1" filter="url(#softShadow)"/><text x="1265" y="484" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="middle" letter-spacing="0" opacity="1">05</text><text x="1265" y="526" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">revision 증가</text><line x1="1347" y1="500" x2="1473" y2="500" stroke="#A7B8D7" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 1458 489 L 1473 500 L 1458 511" fill="none" stroke="#A7B8D7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1555" cy="500" r="74" fill="#FFFFFF" stroke="#C9E85B" stroke-width="4" opacity="1" filter="url(#softShadow)"/><text x="1555" y="484" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#C9E85B" text-anchor="middle" letter-spacing="0" opacity="1">06</text><text x="1555" y="526" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">검수 재확정</text><rect x="100" y="665" width="800" height="220" rx="28" fill="#16234A" stroke="#31477A" stroke-width="2" opacity="1" filter="url(#softShadow)"/><text x="145" y="720" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="1.2" opacity="1">동시 수정 방어</text><text x="145" y="770" font-family="NotoKR, Arial, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="145" dy="0">stale version이면 전체 롤백</tspan><tspan x="145" dy="32.550000000000004">여러 범위는 뒤에서부터 교체</tspan><tspan x="145" dy="32.550000000000004">문서 버전은 배치당 한 번 증가</tspan></text><rect x="960" y="665" width="800" height="220" rx="28" fill="#FFFFFF" stroke="#C9E85B" stroke-width="2" opacity="1" filter="url(#softShadow)"/><text x="1005" y="720" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#87A800" text-anchor="start" letter-spacing="1.2" opacity="1">검수 완료 후</text><text x="1005" y="770" font-family="NotoKR, Arial, sans-serif" font-size="21" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="1005" dy="0">제외·복원 요소를 본문에 반영</tspan><tspan x="1005" dy="32.550000000000004">is_confirmed 확정</tspan><tspan x="1005" dy="32.550000000000004">청킹·임베딩 재작업 enqueue</tspan></text></svg>