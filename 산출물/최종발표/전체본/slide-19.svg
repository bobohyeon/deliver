<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E162F" flood-opacity="0.11"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0E162F" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FC" stroke="none" stroke-width="0" opacity="1" /><text x="80" y="60" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="2" opacity="1">19  /  글자 인식 검수</text><text x="1840" y="60" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="end" letter-spacing="2.6" opacity="0.62">TASQRA</text><line x1="80" y1="1015" x2="1840" y2="1015" stroke="#DCE5F1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1" opacity="1">발표  박세현</text><text x="1840" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="end" letter-spacing="1" opacity="1">담당  박세현</text><text x="80" y="125" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.6" opacity="1">화면과 검색 본문을 함께 수정</text><text x="80" y="195" font-family="NotoKR, Arial, sans-serif" font-size="43" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="-0.8" opacity="1">글자 인식 결과를 고치면 검색용 본문도 함께 고칩니다</text><text x="82" y="245" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">수정 범위, 본문, 뒤 문장의 위치, 문서 버전을 한 번에 바꿔 서로 어긋나지 않게 합니다.</text><rect x="80" y="300" width="1760" height="335" rx="28" fill="#F8FAFD" stroke="#DCE5F1" stroke-width="2" opacity="1" /><text x="120" y="350" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.5" opacity="1">한 번에 모두 처리</text><rect x="1510" y="325" width="275" height="38" rx="19.0" fill="#E7EEFF" stroke="none" stroke-width="0" opacity="1" /><text x="1647.5" y="349.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#16234A" text-anchor="middle" letter-spacing="0" opacity="1">시작  →  저장 완료</text><line x1="190" y1="480" x2="1740" y2="480" stroke="#C6D3E8" stroke-width="6" stroke-linecap="round" opacity="1"/><circle cx="190" cy="480" r="66" fill="#FFFFFF" stroke="#315BD8" stroke-width="4" opacity="1" filter="url(#softShadow)"/><text x="190" y="466" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">01</text><text x="190" y="510" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">박스 수정</text><line x1="262" y1="480" x2="428" y2="480" stroke="#9EB0CE" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 413 469 L 428 480 L 413 491" fill="none" stroke="#9EB0CE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="500" cy="480" r="66" fill="#FFFFFF" stroke="#3BC7F4" stroke-width="4" opacity="1" filter="url(#softShadow)"/><text x="500" y="466" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="middle" letter-spacing="0" opacity="1">02</text><text x="500" y="510" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">범위 검증</text><line x1="572" y1="480" x2="738" y2="480" stroke="#9EB0CE" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 723 469 L 738 480 L 723 491" fill="none" stroke="#9EB0CE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="810" cy="480" r="66" fill="#FFFFFF" stroke="#C9E85B" stroke-width="4" opacity="1" filter="url(#softShadow)"/><text x="810" y="466" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="800" font-style="normal" fill="#C9E85B" text-anchor="middle" letter-spacing="0" opacity="1">03</text><text x="810" y="510" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">본문 구간 교체</text><line x1="882" y1="480" x2="1048" y2="480" stroke="#9EB0CE" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 1033 469 L 1048 480 L 1033 491" fill="none" stroke="#9EB0CE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1120" cy="480" r="66" fill="#FFFFFF" stroke="#5576E8" stroke-width="4" opacity="1" filter="url(#softShadow)"/><text x="1120" y="466" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="800" font-style="normal" fill="#5576E8" text-anchor="middle" letter-spacing="0" opacity="1">04</text><text x="1120" y="510" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">뒤 문장 위치 조정</text><line x1="1192" y1="480" x2="1358" y2="480" stroke="#9EB0CE" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 1343 469 L 1358 480 L 1343 491" fill="none" stroke="#9EB0CE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1430" cy="480" r="66" fill="#FFFFFF" stroke="#3BC7F4" stroke-width="4" opacity="1" filter="url(#softShadow)"/><text x="1430" y="466" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="middle" letter-spacing="0" opacity="1">05</text><text x="1430" y="510" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">문서 버전 올리기</text><line x1="1502" y1="480" x2="1668" y2="480" stroke="#9EB0CE" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 1653 469 L 1668 480 L 1653 491" fill="none" stroke="#9EB0CE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1740" cy="480" r="66" fill="#FFFFFF" stroke="#C9E85B" stroke-width="4" opacity="1" filter="url(#softShadow)"/><text x="1740" y="466" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="800" font-style="normal" fill="#C9E85B" text-anchor="middle" letter-spacing="0" opacity="1">06</text><text x="1740" y="510" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="middle" letter-spacing="0" opacity="1">검수 재확정</text><text x="120" y="590" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">수정한 글자 수만큼 뒤 문장들의 시작·끝 위치를 함께 옮깁니다.</text><rect x="80" y="680" width="835" height="225" rx="28" fill="#16234A" stroke="#31477A" stroke-width="2" opacity="1" filter="url(#softShadow)"/><text x="125" y="735" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="1.3" opacity="1">문제가 생기면 전체 취소</text><text x="125" y="785" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">이미 바뀐 문서</text><text x="390" y="785" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#BFCBE5" text-anchor="start" letter-spacing="0" opacity="1">전체 변경 취소</text><text x="125" y="827" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">여러 곳 수정</text><text x="390" y="827" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#BFCBE5" text-anchor="start" letter-spacing="0" opacity="1">뒤에서부터 교체</text><text x="125" y="869" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">문서 버전</text><text x="390" y="869" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#BFCBE5" text-anchor="start" letter-spacing="0" opacity="1">배치당 한 번 증가</text><rect x="1005" y="680" width="835" height="225" rx="28" fill="#FFFFFF" stroke="#C9E85B" stroke-width="2" opacity="1" filter="url(#softShadow)"/><text x="1050" y="735" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#87A800" text-anchor="start" letter-spacing="1.3" opacity="1">수정 뒤 다시 준비</text><text x="1050" y="785" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">본문 반영</text><text x="1280" y="785" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">제외·복원 요소</text><text x="1050" y="827" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">검수 확정</text><text x="1280" y="827" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">검수 완료 상태</text><text x="1050" y="869" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">재작업</text><text x="1280" y="869" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">문서 나누기·검색 준비 다시 실행</text><text x="960" y="960" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#64748B" text-anchor="middle" letter-spacing="0" opacity="1">화면에서 고친 내용과 검색에 쓰는 원문을 항상 같게 유지합니다</text></svg>