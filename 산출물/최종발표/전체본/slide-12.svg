oKR, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569" text-anchor="start"><tspan x="1535" dy="0">문서명 · 페이지</tspan><tspan x="1535" dy="25.5">원문 위치</tspan></text><rect x="85" y="705" width="1705" height="210" rx="28" fill="#16234A" stroke="#31477A" stroke-width="2" opacity="1" filter="url(#softShadow)"/><text x="130" y="765" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="1" opacity="1">검색 요청</text><text x="130" y="822" font-family="NotoKR, Arial, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">질문을 검색용 숫자로 바꾼 뒤, 권한이 있는 프로젝트 안에서 뜻이 가까운 문서 조각을 찾습니다.</text><text x="130" y="870" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="500" font-style="normal" fill="#B9C8E5" text-anchor="start" letter-spacing="0" opacity="1">검색 모델을 바꾸면 기존 문서도 새 모델에 맞게 다시 준비해야 합니다.</text><rect x="1530" y="755" width="210" height="38" rx="19.0" fill="#243A70" stroke="none" stroke-width="0" opacity="1" /><text x="1635.0" y="779.44" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#C9E85B" text-anchor="middle" letter-spacing="0" opacity="1">현재 코드 설정</text></svg>