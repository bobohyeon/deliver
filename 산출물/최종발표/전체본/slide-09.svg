<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E162F" flood-opacity="0.11"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0E162F" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FC" stroke="none" stroke-width="0" opacity="1" /><text x="80" y="60" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="2" opacity="1">09  /  오래 걸리는 작업</text><text x="1840" y="60" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="end" letter-spacing="2.6" opacity="0.62">TASQRA</text><line x1="80" y1="1015" x2="1840" y2="1015" stroke="#DCE5F1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1" opacity="1">발표  김보현</text><text x="1840" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="end" letter-spacing="1" opacity="1">담당  박세현 · 최재정</text><text x="80" y="125" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.6" opacity="1">실패해도 안전하게 다시 처리</text><text x="80" y="195" font-family="NotoKR, Arial, sans-serif" font-size="46" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="-0.8" opacity="1">오래 걸리는 작업은 실패해도 안전하게 다시 처리합니다</text><text x="82" y="245" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">문서 읽기와 나누기는 다시 시도하고, 인공지능 분석은 원문 변경과 일부 실패를 따로 기록합니다.</text><rect x="80" y="273" width="118" height="7" rx="4" fill="#315BD8" stroke="none" stroke-width="0" opacity="1" /><rect x="206" y="273" width="24" height="7" rx="4" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><rect x="80" y="310" width="820" height="600" rx="30" fill="#FFFFFF" stroke="#315BD8" stroke-width="2" opacity="1" filter="url(#softShadow)"/><text x="125" y="365" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.5" opacity="1">문서 읽기 · 나누기</text><rect x="125" y="405" width="62" height="34" rx="17.0" fill="#E7EEFF" stroke="none" stroke-width="0" opacity="1" /><text x="156.0" y="427.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">01</text><text x="215" y="430" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">작업 확인 지연</text><text x="215" y="468" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">작업이 사라지면 대기열에 다시 넣음</text><rect x="125" y="540" width="62" height="34" rx="17.0" fill="#E7EEFF" stroke="none" stroke-width="0" opacity="1" /><text x="156.0" y="562.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">02</text><text x="215" y="565" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">재시도 간격 늘리기</text><text x="215" y="603" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">최대 60초 간격 · 2번 더 시도</text><rect x="125" y="675" width="62" height="34" rx="17.0" fill="#E7EEFF" stroke="none" stroke-width="0" opacity="1" /><text x="156.0" y="697.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">03</text><text x="215" y="700" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">다음 단계만 다시 실행</text><text x="215" y="738" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">완료된 글자 인식은 반복하지 않음</text><text x="125" y="850" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="0" opacity="1">문서 읽기가 끝나도 인공지능 분석을 자동으로 이어서 실행하지 않습니다.</text><rect x="960" y="310" width="880" height="600" rx="30" fill="#16234A" stroke="#31477A" stroke-width="2" opacity="1" filter="url(#softShadow)"/><text x="1005" y="365" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="1.5" opacity="1">인공지능 분석 작업</text><circle cx="1025" cy="425" r="8" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><text x="1055" y="432" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">동시에 실행할 분석 1개</text><text x="1280" y="432" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#BFCBE5" text-anchor="start" letter-spacing="0" opacity="1">같은 분석이 두 번 실행되지 않게 함</text><circle cx="1025" cy="507" r="8" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><text x="1055" y="514" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">분석 시작 때의 원문 저장</text><text x="1280" y="514" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#BFCBE5" text-anchor="start" letter-spacing="0" opacity="1">분석 전후 원문이 같은지 확인</text><circle cx="1025" cy="589" r="8" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><text x="1055" y="596" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">분석을 차례로 실행</text><text x="1280" y="596" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#BFCBE5" text-anchor="start" letter-spacing="0" opacity="1">그래픽 장치 과부하 방지</text><circle cx="1025" cy="671" r="8" fill="#C9E85B" stroke="none" stroke-width="0" opacity="1" /><text x="1055" y="678" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">일부 성공 결과 저장</text><text x="1280" y="678" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#BFCBE5" text-anchor="start" letter-spacing="0" opacity="1">일부 성공 결과는 보존</text><circle cx="1025" cy="753" r="8" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><text x="1055" y="760" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">제한 시간</text><text x="1280" y="760" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#BFCBE5" text-anchor="start" letter-spacing="0" opacity="1">정해진 시간을 넘으면 중단</text><rect x="1005" y="840" width="700" height="42" rx="21.0" fill="#243866" stroke="none" stroke-width="0" opacity="1" /><text x="1355.0" y="866.78" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">대기  →  실행 중  →  완료 / 일부 완료 / 실패</text></svg>