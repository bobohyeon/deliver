ill="#3BC7F4" text-anchor="start" letter-spacing="1.0" opacity="1">제품 적용 모델</text><text x="1210" y="835" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">Tasqra-summation</text><rect x="80" y="925" width="1760" height="60" rx="18" fill="#16234A" stroke="#16234A" stroke-width="2" opacity="1" /><text x="960" y="964" font-family="NotoKR, Arial, sans-serif" font-size="21" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">요약 평가는 26건이라 오차가 큽니다. 다음 단계는 평가 문서를 늘려 다시 확인하는 것입니다.</text></svg>