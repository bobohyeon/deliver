<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E162F" flood-opacity="0.11"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0E162F" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FC" stroke="none" stroke-width="0" opacity="1" /><text x="80" y="60" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="2" opacity="1">21  /  실제 적용 모델</text><text x="1840" y="60" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="end" letter-spacing="2.6" opacity="0.62">TASQRA</text><line x1="80" y1="1015" x2="1840" y2="1015" stroke="#DCE5F1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1" opacity="1">발표  박세현</text><text x="1840" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="end" letter-spacing="1" opacity="1">담당  박세현</text><text x="80" y="125" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.6" opacity="1">저장된 측정 결과</text><text x="80" y="195" font-family="NotoKR, Arial, sans-serif" font-size="42" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="-0.8" opacity="1">Qwen2.5-3B를 업무별로 따로 학습해 적용했습니다</text><text x="82" y="245" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">재현 자료가 없는 모델 비교표는 빼고, 제품 문서에 남은 실제 측정값만 사용했습니다.</text><rect x="80" y="300" width="1760" height="570" rx="28" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="100" y="335" width="1720" height="70" rx="18" fill="#16234A" stroke="none" stroke-width="0" opacity="1" /><text x="120" y="380" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0.5" opacity="1">하는 일</text><text x="580" y="380" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0.5" opacity="1">실제 측정 결과</text><text x="920" y="380" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0.5" opacity="1">평가 방법</text><text x="1350" y="380" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0.5" opacity="1">제품 적용 모델</text><rect x="100" y="445" width="1720" height="138" rx="16" fill="#EAF0FF" stroke="none" stroke-width="0" opacity="1" /><circle cx="130" cy="514" r="8" fill="#315BD8" stroke="none" stroke-width="0" opacity="1" /><text x="160" y="523" font-family="NotoKR, Arial, sans-serif" font-size="25" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">문서 종류 분류</text><text x="580" y="523" font-family="NotoKR, Arial, sans-serif" font-size="27" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="0" opacity="1">93.2%  (±2.5%p)</text><text x="920" y="523" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">실제 문서 103건 · 5등분 교차검증</text><text x="1350" y="523" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">Tasqra-classification</text><rect x="100" y="615" width="1720" height="138" rx="16" fill="#F4FBFD" stroke="none" stroke-width="0" opacity="1" /><circle cx="130" cy="684" r="8" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><text x="160" y="693" font-family="NotoKR, Arial, sans-serif" font-size="25" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">문서 요약</text><text x="580" y="693" font-family="NotoKR, Arial, sans-serif" font-size="27" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="0" opacity="1">65.4%  (약 ±8%p)</text><text x="920" y="693" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">평가 문서 26건 · 표본 확대 필요</text><text x="1350" y="693" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">Tasqra-summation</text><rect x="100" y="790" width="1720" height="74" rx="18" fill="#F8FAFD" stroke="#DCE5F1" stroke-width="2" opacity="1" /><text x="145" y="837" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">같은 기본 모델을 쓰지만, 분류용과 요약용 학습 결과는 서로 다른 모델로 배포합니다.</text><rect x="100" y="890" width="1720" height="74" rx="20" fill="#16234A" stroke="#16234A" stroke-width="2" opacity="1" /><text x="145" y="937" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="0" opacity="1">근거</text><text x="235" y="937" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Tasqra/docs/llm-model-setup.md에 기록된 제품 적용 결과</text></svg>