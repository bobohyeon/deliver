<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E162F" flood-opacity="0.11"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0E162F" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FC" stroke="none" stroke-width="0" opacity="1" /><text x="80" y="60" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="2" opacity="1">21  /  실제 모델 평가</text><text x="1840" y="60" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="end" letter-spacing="2.6" opacity="0.62">TASQRA</text><line x1="80" y1="1015" x2="1840" y2="1015" stroke="#DCE5F1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1" opacity="1">발표  박세현</text><text x="1840" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="end" letter-spacing="1" opacity="1">담당  박세현</text><text x="80" y="125" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.6" opacity="1">MEASURED RESULTS</text><text x="80" y="195" font-family="NotoKR, Arial, sans-serif" font-size="43" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="-0.8" opacity="1">무엇을 평가했고, 결과가 어느 정도였는지 함께 봅니다</text><text x="82" y="245" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">제품 문서에 남은 실제 측정값만 사용했으며 두 업무는 서로 다른 학습 모델로 배포합니다.</text><rect x="80" y="273" width="118" height="7" rx="4" fill="#315BD8" stroke="none" stroke-width="0" opacity="1" /><rect x="206" y="273" width="24" height="7" rx="4" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><rect x="80" y="315" width="860" height="585" rx="30" fill="#FFFFFF" stroke="#315BD8" stroke-width="2" opacity="1" filter="url(#softShadow)"/><text x="120" y="375" font-family="NotoKR, Arial, sans-serif" font-size="31" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">문서 종류 분류</text><text x="120" y="500" font-family="NotoKR, Arial, sans-serif" font-size="88" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="0" opacity="1">93.2%</text><text x="123" y="548" font-family="NotoKR, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">정답 문서 유형을 맞힌 비율</text><rect x="120" y="585" width="780" height="24" rx="12" fill="#E2E8F4" stroke="none" stroke-width="0" opacity="1" /><rect x="120" y="585" width="726.96" height="24" rx="12" fill="#315BD8" stroke="none" stroke-width="0" opacity="1" /><rect x="120" y="655" width="240" height="118" rx="18" fill="#F7F9FD" stroke="#DCE5F1" stroke-width="2" opacity="1" /><text x="140" y="693" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="800" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="0.8" opacity="1">평가 대상</text><text x="140" y="738" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">실제 문서 103건</text><rect x="380" y="655" width="240" height="118" rx="18" fill="#F7F9FD" stroke="#DCE5F1" stroke-width="2" opacity="1" /><text x="400" y="693" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="800" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="0.8" opacity="1">평가 방법</text><text x="400" y="738" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">5등분 교차검증</text><rect x="640" y="655" width="240" height="118" rx="18" fill="#F7F9FD" stroke="#DCE5F1" stroke-width="2" opacity="1" /><text x="660" y="693" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="800" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="0.8" opacity="1">결과 오차</text><text x="660" y="738" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">±2.5%p</text><text x="120" y="835" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.0" opacity="1">제품 적용 모델</text><text x="310" y="835" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">Tasqra-classification</text><rect x="980" y="315" width="860" height="585" rx="30" fill="#FFFFFF" stroke="#3BC7F4" stroke-width="2" opacity="1" filter="url(#softShadow)"/><text x="1020" y="375" font-family="NotoKR, Arial, sans-serif" font-size="31" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">문서 요약</text><text x="1020" y="500" font-family="NotoKR, Arial, sans-serif" font-size="88" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="0" opacity="1">65.4%</text><text x="1023" y="548" font-family="NotoKR, Arial, sans-serif" font-size="21" font-weight="