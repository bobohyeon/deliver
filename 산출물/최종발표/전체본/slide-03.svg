<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0E162F" flood-opacity="0.10"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0E162F" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FC" stroke="none" stroke-width="0" opacity="1" /><text x="110" y="70" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="2.2" opacity="1">02  /  서비스 목표</text><text x="1810" y="70" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="end" letter-spacing="2.5" opacity="0.65">TASQRA</text><text x="110" y="130" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.8" opacity="1">인공지능 제안 · 사람 확인</text><text x="110" y="205" font-family="NotoKR, Arial, sans-serif" font-size="56" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="110" dy="0">Tasqra는 문서에서 실행까지</tspan><tspan x="110" dy="64.39999999999999">한 흐름으로 연결합니다</tspan></text><line x1="960" y1="600" x2="400" y2="530" stroke="#B8C7E6" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="680.0" cy="565.0" r="8" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><line x1="960" y1="600" x2="1520" y2="530" stroke="#B8C7E6" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="1240.0" cy="565.0" r="8" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><line x1="960" y1="600" x2="960" y2="805" stroke="#B8C7E6" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="960.0" cy="702.5" r="8" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><circle cx="960" cy="600" r="165" fill="#16234A" stroke="#D9E3FA" stroke-width="18" opacity="1" filter="url(#shadow)"/><circle cx="960" cy="600" r="137" fill="#1D2E5C" stroke="#315BD8" stroke-width="3" opacity="1" /><text x="960" y="550" font-family="NotoKR, Arial, sans-serif" font-size="26" font-weight="500" font-style="normal" fill="#C4D0EC" text-anchor="middle" letter-spacing="0" opacity="1">인공지능이 제안하고,</text><text x="960" y="615" font-family="NotoKR, Arial, sans-serif" font-size="52" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">사람이</text><text x="960" y="672" font-family="NotoKR, Arial, sans-serif" font-size="50" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="middle" letter-spacing="0" opacity="1">확정합니다</text><rect x="155" y="415" width="490" height="260" rx="28" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" filter="url(#softShadow)"/><circle cx="220" cy="485" r="36" fill="#EAF0FA" stroke="#315BD8" stroke-width="2" opacity="1" /><g fill="none" stroke="#315BD8" stroke-width="3" stroke-linecap="round"><circle cx="217.45" cy="482.28" r="8.16"/><line x1="223.4" y1="488.23" x2="230.88" y2="495.71"/></g><text x="275" y="470" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.6" opacity="1">01</text><text x="275" y="517" font-family="NotoKR, Arial, sans-serif" font-size="33" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">찾는다</text><text x="197" y="580" font-family="NotoKR, Arial, sans-serif" font-size="24" font-weight="500" fill="#475569" text-anchor="start"><tspan x="197" dy="0">문서 근거와 함께 필요한 정보를</tspan><tspan x="197" dy="36.0">검색합니다.</tspan></text><rect x="1275"