4"/><line x1="778.3000000000001" y1="897.55" x2="786.8000000000001" y2="897.55"/></g><text x="835" y="880" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#C9E85B" text-anchor="start" letter-spacing="1.6" opacity="1">03</text><text x="835" y="927" font-family="NotoKR, Arial, sans-serif" font-size="33" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">연결한다</text><text x="757" y="990" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569" text-anchor="start"><tspan x="757" dy="0">승인된 정보를 태스크·대시보드·산출물에 반영합니다.</tspan></text></svg>