FFFFF" text-anchor="middle" letter-spacing="0" opacity="1">02</text><circle cx="1158" cy="423" r="35" fill="#24345F" stroke="#C9E85B" stroke-width="2" opacity="1" /><g fill="none" stroke="#C9E85B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="1158" cy="423" r="10.56"/><path d="M 1152.56 423 l 4.0 4.32 l 7.68 -8.32"/></g><text x="730" y="476" font-family="NotoKR, Arial, sans-serif" font-size="30" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">사람이 확정한다</text><text x="730" y="526" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="500" fill="#C8D4EC" text-anchor="start"><tspan x="730" dy="0">검토 대기 제안 확인</tspan><tspan x="730" dy="30.0">승인된 정보만 사용</tspan></text><rect x="1290" y="360" width="520" height="350" rx="26" fill="#17264F" stroke="#5576E8" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="1290" y="360" width="520" height="10" rx="5" fill="#5576E8" stroke="none" stroke-width="0" opacity="1" /><rect x="1318" y="392" width="62" height="34" rx="17.0" fill="#5576E8" stroke="none" stroke-width="0" opacity="1" /><text x="1349.0" y="414.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">03</text><circle cx="1748" cy="423" r="35" fill="#24345F" stroke="#5576E8" stroke-width="2" opacity="1" /><g fill="none" stroke="#5576E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="1737.6" y="413.4" width="20.8" height="19.2" rx="6"/><path d="M 1740.48 419.0 l 1.6 1.6 l 2.88 -3.2"/><line x1="1746.3999999999999" y1="418.84" x2="1754.3999999999999" y2="418.84"/><path d="M 1740.48 425.56 l 1.6 1.6 l 2.88 -3.2"/><line x1="1746.3999999999999" y1="425.4" x2="1754.3999999999999" y2="425.4"/></g><text x="1320" y="476" font-family="NotoKR, Arial, sans-serif" font-size="30" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">업무로 연결한다</text><text x="1320" y="526" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="500" fill="#C8D4EC" text-anchor="start"><tspan x="1320" dy="0">태스크 · 대시보드</tspan><tspan x="1320" dy="30.0">보고서와 업무 문서</tspan></text><rect x="110" y="790" width="1700" height="125" rx="26" fill="#1D2D59" stroke="#344A7E" stroke-width="2" opacity="1" filter="url(#softShadow)"/><text x="960" y="850" font-family="NotoKR, Arial, sans-serif" font-size="29" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">인공지능이 제안하고, 사람이 확정하고, 승인된 정보가 실행으로 이어집니다.</text><text x="960" y="892" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="middle" letter-spacing="2.2" opacity="1">Tasqra</text></svg>