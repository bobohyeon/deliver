<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E162F" flood-opacity="0.11"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0E162F" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#0E162F" stroke="none" stroke-width="0" opacity="1" /><text x="80" y="60" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="2" opacity="1">27  /  결론</text><text x="1840" y="60" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="end" letter-spacing="2.6" opacity="0.62">TASQRA</text><line x1="80" y1="1015" x2="1840" y2="1015" stroke="#29385F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#8EA0CA" text-anchor="start" letter-spacing="1" opacity="1">발표  박세현</text><text x="1840" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#8EA0CA" text-anchor="end" letter-spacing="1" opacity="1">담당  팀</text><text x="80" y="125" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="1.6" opacity="1">문서에서 판단과 실행까지</text><text x="80" y="195" font-family="NotoKR, Arial, sans-serif" font-size="47" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.8" opacity="1">문서를 보관하는 도구를 넘어, 판단 근거를 찾고