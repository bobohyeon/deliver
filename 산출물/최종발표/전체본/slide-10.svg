<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E162F" flood-opacity="0.11"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0E162F" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FC" stroke="none" stroke-width="0" opacity="1" /><text x="80" y="60" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="2" opacity="1">10  /  두 검색 함께 사용</text><text x="1840" y="60" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="end" letter-spacing="2.6" opacity="0.62">TASQRA</text><line x1="80" y1="1015" x2="1840" y2="1015" stroke="#DCE5F1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1" opacity="1">발표  김보현</text><text x="1840" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="end" letter-spacing="1" opacity="1">담당  김보현</text><text x="80" y="125" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.6" opacity="1">검색창 하나</text><text x="80" y="195" font-family="NotoKR, Arial, sans-serif" font-size="44" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="-0.8" opacity="1">글자가 같은 결과와 뜻이 비슷한 결과를 함께 찾습니다</text><text x="82" y="245" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">각 검색에서 앞에 나온 결과에 점수를 주어 최종 순서를 정합니다.</text><rect x="100" y="330" width="570" height="390" rx="26" fill="#17264F" stroke="#3BC7F4" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="100" y="330" width="570" height="10" rx="5" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><rect x="128" y="362" width="62" height="34" rx="17.0" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><text x="159.0" y="384.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">A</text><circle cx="608" cy="393" r="35" fill="#24345F" stroke="#3BC7F4" stroke-width="2" opacity="1" /><g fill="none" stroke="#3BC7F4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="599.2" y="382.12" width="17.6" height="21.76" rx="5"/><path d="M 610.08 382.12 v 5.44 h 6.72"/><line x1="602.72" y1="392.52" x2="612.6400000000001" y2="392.52"/><line x1="602.72" y1="396.68" x2="610.72" y2="396.68"/></g><text x="130" y="446" font-family="NotoKR, Arial, sans-serif" font-size="26" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">키워드 검색</text><text x="130" y="496" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="500" fill="#C8D4EC" text-anchor="start"><tspan x="130" dy="0">입력한 글자가 이어진 문장 찾기</tspan><tspan x="130" dy="27.0">글자가 더 비슷한 순서로 정렬</tspan><tspan x="130" dy="27.0">숫자·코드·정확한 표현을 잘 찾음</tspan></text><rect x="1250" y="330" width="570" height="390" rx="26" fill="#17264F" stroke="#5576E8" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="1250" y="330" width="570" height="10" rx="5" fill="#5576E8" stroke="none" stroke-width="0" opacity="1" /><rect x="1278" y="362" width="62" height="34" rx="17.0" fill="#5576E8" stroke="none" stroke-width="0" opacity="1" /><text x="1309.0" y="384.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">B</text><circle cx="1758" cy="393" r="35" fill="#24345F" stroke="#5576E8" stroke-width="2" opacity="1" /><g fill="none" stroke="#5576E8" stroke-width="3" stroke-linecap="round"><circle cx="1755.6" cy="390.44" r="7.68"/><line x1="1761.2" y1="396.04" x2="1768.24" y2="403.08"/></g><text x="1280" y="446" font-family="NotoKR, Arial, sans-serif" font-size="26" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">의미 검색</text><text x="1280" y="496" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="500" fill="#C8D4EC" text-anchor="start"><tspan x="1280" dy="0">질문과 문장의 뜻 비교</tspan><tspan x="1280" dy="27.0">뜻이 가까운 순서로 정렬</tspan><tspan x="1280" dy="27.0">표현이 달라도 뜻이 비슷하면 찾음</tspan></text><circle cx="960" cy="515" r="130" fill="#C9E85B" stroke="#A9C932" stroke-width="4" opacity="1" filter="url(#shadow)"/><text x="960" y="493" font-family="NotoKR, Arial, sans-serif" font-size="40" font-weight="800" font-style="normal" fill="#0E162F" text-anchor="middle" letter-spacing="0" opacity="1">순위 합산</text><text x="960" y="545" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0E162F" text-anchor="middle" letter-spacing="0" opacity="1">앞에 나온 결과에 더 높은 점수</text><line x1="690" y1="515" x2="810" y2="515" stroke="#3BC7F4" stroke-width="5" stroke-linecap="round" opacity="1"/><path d="M 795 504 L 810 515 L 795 526" fill="none" stroke="#3BC7F4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="1230" y1="515" x2="1110" y2="515" stroke="#5576E8" stroke-width="5" stroke-linecap="round" opacity="1"/><path d="M 1125 504 L 1110 515 L 1125 526" fill="none" stroke="#5576E8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="780" width="520" height="112" rx="20" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="100" y="780" width="8" height="112" rx="4" fill="#315BD8" stroke="none" stroke-width="0" opacity="1" /><text x="128" y="820" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">비교 범위</text><text x="128" y="859" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">두 검색에서 상위 30개씩 비교</text><rect x="700" y="780" width="520" height="112" rx="20" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="700" y="780" width="8" height="112" rx="4" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><text x="728" y="820" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">사용 방법</text><text x="728" y="859" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">사용자는 검색창 하나만 사용</text><rect x="1300" y="780" width="520" height="112" rx="20" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="1300" y="780" width="8" height="112" rx="4" fill="#C9E85B" stroke="none" stroke-width="0" opacity="1" /><text x="1328" y="820" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">주의</text><text x="1328" y="859" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">별도 검색엔진이나 점수 비율 조정은 아직 없음</text></svg