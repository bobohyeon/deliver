mal" fill="#5576E8" text-anchor="middle" letter-spacing="0" opacity="1">03</text><text x="975" y="760" font-family="NotoKR, Arial, sans-serif" font-size="23" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">빈 페이지 전체 OCR</text><text x="975" y="805" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="600" fill="#475569" text-anchor="start"><tspan x="975" dy="0">글자가 전혀 없으면 2배 렌더링</tspan><tspan x="975" dy="24.8">작은 글자 인식 보완</tspan></text><line x1="1332" y1="780" x2="1375" y2="780" stroke="#9FB1D1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 1360 769 L 1375 780 L 1360 791" fill="none" stroke="#9FB1D1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1385" y="665" width="375" height="235" rx="24" fill="#FFFFFF" stroke="#C9E85B" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="1410" y="690" width="62" height="34" rx="17.0" fill="#E7EEFF" stroke="none" stroke-width="0" opacity="1" /><text x="1441.0" y="712.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#C9E85B" text-anchor="middle" letter-spacing="0" opacity="1">04</text><text x="1410" y="760" font-family="NotoKR, Arial, sans-serif" font-size="23" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">좌표·순서 복원</text><text x="1410" y="805" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="600" fill="#475569" text-anchor="start"><tspan x="1410" dy="0">PDF 좌표로 되돌린 뒤</tspan><tspan x="1410" dy="24.8">단·표를 보존해 읽기 순서 계산</tspan></text><text x="960" y="960" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">미니프로젝트의 엔진 비교  →  필요한 영역만 OCR  →  수정 가능한 좌표·읽기 순서 보존</text></svg>