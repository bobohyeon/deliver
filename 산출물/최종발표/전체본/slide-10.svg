ly="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">EasyOCR</text><text x="520" y="474" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="end" letter-spacing="0" opacity="1">81.8%</text><text x="710" y="474" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#475569" text-anchor="end" letter-spacing="0" opacity="1">15.5초</text><rect x="120" y="504" width="620" height="50" rx="14" fill="#F7F9FD" stroke="#64748B" stroke-width="2" opacity="1" /><text x="145" y="536" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">Tesseract</text><text x="520" y="536" font-family="NotoKR, Arial, sans-serif" font-size="19" font-weight="800" font-style="normal" fill="#64748B" text-anchor="end" letter-spacing="0" opacity="1">64.4%</text><text x="710" y="536" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#475569" text-anchor="end" letter-spacing="0" opacity="1">0.9초</text><text x="120" y="585" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="600" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="0" opacity="1">정답 텍스트 대비 CER 기반 정확도  ·  미니프로젝트 저장 기준선</text><rect x="820" y="305" width="1020" height="300" rx="26" fill="#16234A" stroke="#31477A" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="860" y="340" width="160" height="38" rx="19.0" fill="#243866" stroke="none" stroke-width="0" opacity="1" /><text x="940.0" y="364.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#C9E85B" text-anchor="middle" letter-spacing="0" opacity="1">선택 결론</text><text x="860" y="435" font-family="NotoKR, Arial, sans-serif" font-size="38" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">PaddleOCR</text><text x="860" y="485" font-family="NotoKR, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">세 엔진 중 정답 정확도가 가장 높아 기본 OCR로 사용</text><rect x="860" y="520" width="430" height="62" rx="14" fill="#1D315F" stroke="#3A5289" stroke-width="2" opacity="1" /><text x="878" y="547" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="0" opacity="1">정확도 우선</text><text x="878" y="572" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="600" font-style="normal" fill="#C8D4EC" text-anchor="start" letter-spacing="0" opacity="1">속도가 가장 빠르지는 않음</text><rect x="1320" y="520" width="430" height="62" rx="14" fill="#1D315F" stroke="#3A5289" stroke-width="2" opacity="1" /><text x="1338" y="547" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="800" font-style="normal" fill="#C9E85B" text-anchor="start" letter-spacing="0" opacity="1">처리 범위 축소</text><text x="1338" y="572" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="600" font-style="normal" fill="#C8D4EC" text-anchor="start" letter-spacing="0" opacity="1">모든 페이지를 무조건 OCR하지 않음</text><rect x="80" y="665" width="375" height="235" rx="24" fill="#FFFFFF" stroke="#315BD8" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="105" y="690" width="62" height="34" rx="17.0" fill="#E7EEFF" stroke="none" stroke-width="0" opacity="1" /><text x="136.0" y="712.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">01</text><text x="105" y="760" font-family="NotoKR, Arial, sans-serif" font-size="23" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" o