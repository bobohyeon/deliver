linejoin="round"><rect x="1659.35" y="487.4" width="27.3" height="25.2" rx="6"/><path d="M 1663.1299999999999 494.75 l 2.1 2.1 l 3.78 -4.2"/><line x1="1670.8999999999999" y1="494.53999999999996" x2="1681.3999999999999" y2="494.53999999999996"/><path d="M 1663.1299999999999 503.35999999999996 l 2.1 2.1 l 3.78 -4.2"/><line x1="1670.8999999999999" y1="503.15" x2="1681.3999999999999" y2="503.15"/></g><text x="1284" y="565" font-family="NotoKR, Arial, sans-serif" font-size="34" font-weight="800" font-style="normal" fill="#111827" text-anchor="start" letter-spacing="0" opacity="1">실행으로 이어지지 않는다</text><text x="1284" y="625" font-family="NotoKR, Arial, sans-serif" font-size="24" font-weight="500" fill="#475569" text-anchor="start"><tspan x="1284" dy="0">액션아이템이 실제 태스크로 연결되지 않아</tspan><tspan x="1284" dy="37.2">누락과 재작업이 생깁니다.</tspan></text><line x1="1284" y1="720" x2="1716" y2="720" stroke="#D5DCE7" stroke-width="2" stroke-linecap="square" opacity="1"/><text x="1284" y="746" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="800" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="2.0" opacity="1">INFORMATION GAP</text><rect x="110" y="825" width="1640" height="140" rx="8" fill="#111B31" stroke="none" stroke-width="0" opacity="1" filter="url(#softShadow)"/><circle cx="180" cy="895" r="30" fill="#2563EB" stroke="none" stroke-width="0" opacity="1" /><g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="170.65" y="883.44" width="18.700000000000003" height="23.12" rx="5"/><path d="M 182.21 883.44 v 5.78 h 7.14"/><line x1="174.39000000000001" y1="894.49" x2="184.93" y2="894.49"/><line x1="174.39000000000001" y1="898.9100000000001" x2="182.89000000000001" y2="898.9100000000001"/></g><text x="240" y="882" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#2FA8CC" text-anchor="start" letter-spacing="1.3" opacity="1">핵심 문제</text><text x="240" y="925" font-family="NotoKR, Arial, sans-serif" font-size="31" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">문서 보관의 문제가 아니라, 정보가 실행으로 이어지지 않는 문제입니다.</text></svg>