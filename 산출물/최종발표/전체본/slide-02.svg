<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#09111F" flood-opacity="0.06"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#09111F" flood-opacity="0.05"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F5F7FA" stroke="none" stroke-width="0" opacity="1" /><text x="110" y="70" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#2563EB" text-anchor="start" letter-spacing="2.2" opacity="1">01  /  PROBLEM</text><text x="1810" y="70" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#111827" text-anchor="end" letter-spacing="2.5" opacity="0.65">TASQRA</text><text x="110" y="130" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#2563EB" text-anchor="start" letter-spacing="1.8" opacity="1">WHY TASQRA</text><text x="110" y="205" font-family="NotoKR, Arial, sans-serif" font-size="56" font-weight="800" fill="#111827" text-anchor="start"><tspan x="110" dy="0">문서는 쌓이는데,</tspan><tspan x="110" dy="64.39999999999999">업무는 연결되지 않습니다</tspan></text><text x="112" y="340" font-family="NotoKR, Arial, sans-serif" font-size="25" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">프로젝트 정보가 문서 안에 머무르면 검색·판단·후속 실행이 반복해서 끊어집니다.</text><rect x="110" y="420" width="500" height="345" rx="8" fill="#FFFFFF" stroke="#D5DCE7" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="110" y="420" width="5" height="345" rx="0" fill="#2563EB" stroke="none" stroke-width="0" o