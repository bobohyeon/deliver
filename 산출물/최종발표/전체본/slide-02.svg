<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0E162F" flood-opacity="0.10"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0E162F" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FC" stroke="none" stroke-width="0" opacity="1" /><text x="110" y="70" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="2.2" opacity="1">01  /  TARGET SELECTION</text><text x="1810" y="70" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="end" letter-spacing="2.5" opacity="0.65">TASQRA</text><text x="110" y="130" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.8" opacity="1">WHY PUBLIC SI &amp; SERVICE PROJECTS</text><text x="110" y="205" font-family="NotoKR, Arial, sans-serif" font-size="50" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="110" dy="0">공개 데이터가 많을 것이라는</tspan><tspan x="110" dy="57.49999999999999">가설에서 시작했습니다</tspan></text><text x="112" y="340" font-family="NotoKR, Arial, sans-serif" font-size="25" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">타깃 선정 당시의 판단과 프로젝트를 진행하며 확인한 한계를 구분했습니다.</text><rect x="110" y="420" width="500" height="345" rx="28" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="110" y="420" width="500" height="12" rx="6" fill="#315BD8" stroke="none" stroke-width="0" opacity="1" /><rect x="142" y="460" width="64" height="36" rx="18.0" fill="#E7EEFF" stroke="none" stroke-width="0" opacity="1" /><text x="174.0" y="483.78" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">01</text><circle cx="533" cy="500" r="46" fill="#EAF0FA" stroke="#315BD8" stroke-width="2" opacity="1" /><g fill="none" stroke="#315BD8" stroke-width="3" stroke-linecap="round"><circle cx="529.85" cy="496.64" r="10.08"/><line x1="537.2" y1="503.99" x2="546.44" y2="513.23"/></g><text x="144" y="565" font-family="NotoKR, Arial, sans-serif" font-size="29" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">초기 가설</text><text x="144" y="622" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start"><tspan x="144" dy="0">나라장터 등에 공개된 문서가 많아</tspan><tspan x="144" dy="30.0">학습과 검증에 필요한 데이터를</tspan><tspan x="144" dy="30.0">쉽게 확보할 수 있을 것으로 봤습니다.</tspan></text><line x1="144" y1="720" x2="576" y2="720" stroke="#DCE5F1" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="144" y="746" font-family="NotoKR, Arial, sans-serif" font-size="12" font-weight="800" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1.2" opacity="1">HYPOTHESIS  →  SELECTION  →  LEARNING</text><rect x="680" y="420" width="500" height="345" rx="28" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="680" y="420" width="500" height="12" rx="6" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><rect x="712" y="460" width="64" height="36" rx="18.0" fill="#E7EEFF" stroke="none" stroke-width="0" opacity="1" /><text x="744.0" y="483.78" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">02</text><circle cx="1103" cy="500" r="46" fill="#EAF0FA" stroke="#3BC7F4" stroke-width="2" opacity="1" /><g fill="none" stroke="#3BC7F4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="1091.45" y="485.72" width="23.1" height="28.560000000000002" rx="5"/><path d="M 1105.73 485.72 v 7.140000000000001 h 8.82"/><line x1="1096.07" y1="499.37" x2="1109.0900000000001" y2="499.37"/><line x1="1096.07" y1="504.83000000000004" x2="1106.57" y2="504.83000000000004"/></g><text x="714" y="565" font-family="NotoKR, Arial, sans-serif" font-size="29" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">타깃 선정</text><text x="714" y="622" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start"><tspan x="714" dy="0">공개 문서를 활용할 수 있는</tspan><tspan x="714" dy="30.0">공공 SI 중심의 공공 용역 사업을</tspan><tspan x="714" dy="30.0">프로젝트 대상으로 정했습니다.</tspan></text><line x1="714" y1="720" x2="1146" y2="720" stroke="#DCE5F1" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="714" y="746" font-family="NotoKR, Arial, sans-serif" font-size="12" font-weight="800" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1.2" opacity="1">HYPOTHESIS  →  SELECTION  →  LEARNING</text><rect x="1250" y="420" width="500" height="345" rx="28" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="1250" y="420" width="500" height="12" rx="6" fill="#C9E85B" stroke="none" stroke-width="0" opacity="1" /><rect x="1282" y="460" width="64" height="36" rx="18.0" fill="#E7EEFF" stroke="none" stroke-width="0" opacity="1" /><text x="1314.0" y="483.78" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">03</text><circle cx="1673" cy="500" r="46" fill="#EAF0FA" stroke="#C9E85B" stroke-width="2" opacity="1" /><g fill="none" stroke="#C9E85B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="1673" cy="500" r="13.860000000000001"/><path d="M 1665.86 500 l 5.25 5.67 l 10.08 -10.92"/></g><text x="1284" y="565" font-family="NotoKR, Arial, sans-serif" font-size="29" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">진행 후 확인</text><text x="1284" y="622" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start"><tspan x="1284" dy="0">원문 문서는 많았지만 정답 표시가 된</tspan><tspan x="1284" dy="30.0">학습·평가용 샘플은 부족해</tspan><tspan x="1284" dy="30.0">직접 정리하고 평가 기준을 만들었습니다.</tspan></text><line x1="1284" y1="720" x2="1716" y2="720" stroke="#DCE5F1" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="1284" y="746" font-family="NotoKR, Arial, sans-serif" font-size="12" font-weight="800" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1.2" opacity="1">HYPOTHESIS  →  SELECTION  →  LEARNING</text><rect x="110" y="825" width="1640" height="140" rx="28" fill="#16234A" stroke="none" stroke-width="0" opacity="1" filter="url(#softShadow)"/><circle cx="180" cy="895" r="30" fill="#315BD8" stroke="none" stroke-width="0" opacity="1" /><g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><line x1="180" y1="886.16" x2="180" y2="895"/><line x1="171.84" y1="902.65" x2="188.16" y2="902.65"/><line x1="171.84" y1="902.65" x2="180" y2="895"/><line x1="188.16" y1="902.65" x2="180" y2="895"/><circle cx="180" cy="885.14" r="3.06" fill="#FFFFFF"/><circle cx="171.16" cy="903.16" r="3.06" fill="#FFFFFF"/><circle cx="188.84" cy="903.16" r="3.06" fill="#FFFFFF"/></g><text x="240" y="882" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="1.1" opacity="1">선정 후 확인한 문제 적합성</text><text x="240" y="925" font-family="NotoKR, Arial, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">발주·계약·과업·보고 문서가 이어지고, 중요한 정보에는 원문 근거와 사람의 확인이 필요했습니다.</text><rect x="110" y="375" width="118" height="7" rx="4" fill="#315BD8" stroke="none" stroke-width="0" opacity="1" /><rect x="236" y="375" width="24" height="7" rx="4" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /></svg>