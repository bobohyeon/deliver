ans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start"><tspan x="1520" dy="0">ID 존재·범위·중복</tspan><tspan x="1520" dy="30.0">원문 메타데이터 매핑</tspan></text><rect x="90" y="700" width="1740" height="210" rx="8" fill="#111B31" stroke="#31477A" stroke-width="1" opacity="1" /><text x="135" y="760" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#2FA8CC" text-anchor="start" letter-spacing="1.2" opacity="1">반환</text><text x="135" y="817" font-family="NotoKR, Arial, sans-serif" font-size="30" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">답변 + 문서명 + 페이지 + 조각 번호 + 원문 좌표</text><text x="135" y="865" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="500" font-style="normal" fill="#BFCBE5" text-anchor="start" letter-spacing="0" opacity="1">근거가 없으면 LLM을 호출하지 않고 고정 응답을 반환합니다.</text><rect x="1380" y="755" width="360" height="38" rx="8" fill="#243864" stroke="none" stroke-width="0" opacity="1" /><text x="1560.0" y="779.44" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2563EB" text-anchor="middle" letter-spacing="0" opacity="1">의미적 사실 검증 아님</text><text x="1380" y="825" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">서버 검증 범위는 근거 ID 계약과 권한입니다.</text></svg>