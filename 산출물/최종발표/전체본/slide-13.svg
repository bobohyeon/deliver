or="middle" letter-spacing="0" opacity="1">pgvector 코사인 순위</text><rect x="1260" y="590" width="530" height="48" rx="14" fill="#1D315F" stroke="#3A5289" stroke-width="2" opacity="1" /><text x="1525.0" y="621" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">놓침  ·  번호·금액처럼 글자 자체가 정답인 표현</text><circle cx="960" cy="495" r="130" fill="#C9E85B" stroke="#A9C932" stroke-width="4" opacity="1" filter="url(#shadow)"/><text x="960" y="477" font-family="NotoKR, Arial, sans-serif" font-size="38" font-weight="800" font-style="normal" fill="#0E162F" text-anchor="middle" letter-spacing="0" opacity="1">순위 합산</text><text x="960" y="520" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#0E162F" text-anchor="middle" letter-spacing="0" opacity="1">순위만 합산</text><text x="960" y="551" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#0E162F" text-anchor="middle" letter-spacing="0" opacity="1">각 상위 30개</text><line x1="700" y1="495" x2="815" y2="495" stroke="#3BC7F4" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M 800 484 L 815 495 L 800 506" fill="none" stroke="#3BC7F4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="1220" y1="495" x2="1105" y2="495" stroke="#5576E8" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M 1120 484 L 1105 495 L 1120 506" fill="none" stroke="#5576E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="735" width="520" height="205" rx="22" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" /><rect x="80" y="735" width="7" height="205" rx="4" fill="#315BD8" stroke="none" stroke-width="0" opacity="1" /><text x="108" y="785" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">점수를 그대로 더하지 않음</text><text x="108" y="835" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="600" fill="#475569" text-anchor="start"><tspan x="108" dy="0">글자 유사도와 벡터 거리는</tspan><tspan x="108" dy="26.35">단위·분포가 달라 직접 비교 불가</tspan></text><rect x="650" y="735" width="520" height="205" rx="22" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" /><rect x="650" y="735" width="7" height="205" rx="4" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><text x="678" y="785" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">각 검색 안에서 순위 계산</text><text x="678" y="835" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="600" fill="#475569" text-anchor="start"><tspan x="678" dy="0">키워드·의미 검색에서</tspan><tspan x="678" dy="26.35">각각 상위 30개 후보를 선택</tspan></text><rect x="1220" y="735" width="520" height="205" rx="22" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" /><rect x="1220" y="735" width="7" height="205" rx="4" fill="#C9E85B" stroke="none" stroke-width="0" opacity="1" /><text x="1248" y="785" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">하나의 결과 목록으로</text><text x="1248" y="835" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="600" fill="#475569" text-anchor="start"><tspan x="1248" dy="0">순위 합산가 두 순위를 합쳐</tspan><tspan x="1248" dy="26.35">사용자에게 최종 순위로 제공</tspan></text></svg>