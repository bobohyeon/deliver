><rect x="650" y="735" width="7" height="180" rx="4" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><text x="678" y="780" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">왜 순위 합산인가</text><text x="678" y="825" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="600" fill="#475569" text-anchor="start"><tspan x="678" dy="0">정규화·가중치 가정 없이</tspan><tspan x="678" dy="24.8">각 검색에서 앞선 순위만 사용</tspan></text><rect x="1220" y="735" width="520" height="180" rx="22" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" /><rect x="1220" y="735" width="7" height="180" rx="4" fill="#C9E85B" stroke="none" stroke-width="0" opacity="1" /><text x="1248" y="780" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">어디까지 말할 수 있나</text><text x="1248" y="825" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="600" fill="#475569" text-anchor="start"><tspan x="1248" dy="0">서로 다른 누락 위험을 보완한 설계</tspan><tspan x="1248" dy="24.8">단일 검색 대비 성능 수치는 아직 없음</tspan></text><text x="960" y="970" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">결론  ·  성능을 입증한 장이 아니라, 두 검색을 함께 둔 이유를 설명하는 장입니다.</text></svg>