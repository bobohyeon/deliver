누락 위험을 한 검색창에서 보완했습니다</text><text x="82" y="245" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">키워드는 정확한 글자를, 의미 검색은 표현이 다른 문장을 찾고 두 결과의 순위를 합칩니다.</text><rect x="80" y="273" width="118" height="7" rx="4" fill="#315BD8" stroke="none" stroke-width="0" opacity="1" /><rect x="206" y="273" width="24" height="7" rx="4" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><rect x="100" y="330" width="590" height="325" rx="28" fill="#16234A" stroke="#3BC7F4" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="130" y="350" width="62" height="34" rx="17.0" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><text x="161.0" y="372.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">A</text><circle cx="615" cy="392" r="38" fill="#24345F" stroke="#3BC7F4" stroke-width="2" opacity="1" /><g fill="none" stroke="#3BC7F4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="605.65" y="380.44" width="18.700000000000003" height="23.12" rx="5"/><path d="M 617.2099999999999 380.44 v 5.78 h 7.14"/><line x1="609.39" y1="391.49" x2="619.93" y2="391.49"/><line x1="609.39" y1="395.91" x2="617.89" y2="395.91"/></g><text x="395.0" y="445" font-family="NotoKR, Arial, sans-serif" font-size="35" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">키워드 검색</text><text x="395.0" y="490" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="middle" letter-spacing="0.3" opacity="1">정확한 글자에 강함</text><text x="395.0" y="535" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#C8D4EC" text-anchor="middle" letter-spacing="0" opacity="1">계약번호 · 금액 · 날짜</text><text x="395.0" y="5