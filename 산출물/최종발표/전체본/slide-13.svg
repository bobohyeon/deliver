<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#09111F" flood-opacity="0.06"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#09111F" flood-opacity="0.05"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F5F7FA" stroke="none" stroke-width="0" opacity="1" /><text x="80" y="60" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#2563EB" text-anchor="start" letter-spacing="2" opacity="1">13  /  GROUNDED QA</text><text x="1840" y="60" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#111827" text-anchor="end" letter-spacing="2.6" opacity="0.62">TASQRA</text><line x1="80" y1="1015" x2="1840" y2="1015" stroke="#D5DCE7" stroke-width="1" stroke-linecap="square" opacity="1"/><text x="80" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1" opacity="1">PRESENTER  김보현</text><text x="1840" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="end" letter-spacing="1" opacity="1">OWNER  김보현</text><text x="80" y="125" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#2563EB" text-anchor="start" letter-spacing="1.6" opacity="1">EVIDENCE CONTRACT</text><text x="80" y="195" font-family="NotoKR, Arial, sans-serif" font-size="48" font-weight="800" font-style="normal" fill="#111827" text-anchor="start" letter-spacing="-0.8" opacity="1">답변보다 먼저 근거의 경계를 설계했습니다</text><text x="82" y="245" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">검색 결과를 토큰 예산 안에 조립하고, 모델이 반환한 근거 ID를 서버가 검증합니다.</text><rect x="70" y="330" width="300" height="310" rx="8" fill="#FFFFFF" stroke="#D5DCE7" stroke-width="1" opacity="1" /><rect x="70" y="330" width="5" height="310" rx="0" fill="#2563EB" stroke="none" stroke-width="0" opacity="1" /><rect x="98" y="362" width="62" height="34" rx="8" fill="#E9EFFB" stroke="none" stroke-width="0" opacity="1" /><text x="129.0" y="384.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2563EB" text-anchor="middle" letter-spacing="0" opacity="1">01</text><rect x="272" y="358" width="70" height="70" rx="5" fill="#EEF2F7" stroke="#2563EB" stroke-width="1" opacity="1" /><g fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"><circle cx="304.6" cy="390.44" r="7.68"/><line x1="310.2" y1="396.04" x2="317.24" y2="403.08"/></g><text x="100" y="446" font-family="NotoKR, Arial, sans-serif" font-size="30" font-weight="800" font-style="normal" fill="#111827" text-anchor="start" letter-spacing="0" opacity="1">하이브리드 검색</text><text x="100" y="496" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start"><tspan x="100" dy="0">최대 24개 후보</tspan><tspan x="100" dy="30.0">프로젝트 권한 범위</tspan></text><line x1="375" y1="485" x2="420" y2="485" stroke="#A9BAD9" stroke-width="3" stroke-linecap="square" opacity="1"/><path d="M 405 474 L 420 485 L 405 496" fill="none" stroke="#A9BAD9" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/><rect x="425" y="330" width="300" height="310" rx="8" fill="#FFFFFF" stroke="#D5DCE7" stroke-width="1" opacity="1" /><rect x="425" y="330" width="5" height="310" rx="0" fill="#2FA8CC" stroke="none" stroke-width="0" opacity="1" /><rect x="453" y="362" width="