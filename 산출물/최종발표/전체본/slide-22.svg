<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#09111F" flood-opacity="0.06"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#09111F" flood-opacity="0.05"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F5F7FA" stroke="none" stroke-width="0" opacity="1" /><text x="80" y="60" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#2563EB" text-anchor="start" letter-spacing="2" opacity="1">22  /  SEHYEON INSERT</text><text x="1840" y="60" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#111827" text-anchor="end" letter-spacing="2.6" opacity="0.62">TASQRA</text><line x1="80" y1="1015" x2="1840" y2="1015" stroke="#D5DCE7" stroke-width="1" stroke-linecap="square" opacity="1"/><text x="80" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1" opacity="1">PRESENTER  박세현</text><text x="1840" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="end" letter-spacing="1" opacity="1">OWNER  박세현</text><text x="80" y="125" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#2563EB" text-anchor="start" letter-spacing="1.6" opacity="1">CONTENT HANDOFF</text><text x="80" y="195" font-family="NotoKR, Arial, sans-serif" font-size="46" font-weight="800" font-style="normal" fill="#111827" text-anchor="start" letter-spacing="-0.8" opacity="1">박세현 발표자료 삽입 위치</text><text x="82" y="245" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">세현님이 전달할 최종 파인튜닝 자료로 이 슬라이드를 교체합니다.</text><rect x="120" y="330" width="1680" height="520" rx="8" fill="#FFFFFF" stroke="#D5DCE7" stroke-width="1" opacity="1" /><rect x="120" y="330" width="7" height="520" rx="0" fill="#2563EB" stroke="none" stroke-width="0" opacity="1" /><text x="180" y="410" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#2563EB" text-anchor="start" letter-spacing="2.0" opacity="1">SLIDE 22</text><text x="180" y="500" font-family="NotoKR, Arial, sans-serif" font-size="54" font-weight="800" font-style="normal" fill="#111827" text-anchor="start" letter-spacing="0" opacity="1">박세현 자료 삽입 예정</text><text x="180" y="565" font-family="NotoKR, Arial, sans-serif" font-size="24" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">현재 내용은 자리표시자이며 최종 발표 전 교체 대상입니다.</text><line x1="180" y1="630" x2="1740" y2="630" stroke="#D5DCE7" stroke-width="2" stroke-linecap="square" opacity="1"/><text x="180" y="700" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#2563EB" text-anchor="start" letter-spacing="1.2" opacity="1">권장 포함 항목</text><text x="420" y="700" font-family="NotoKR, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#111B31" text-anchor="start" letter-spacing="0" opacity="1">학습 목적  /  데이터 조건  /  평가 결과  /  실제 배포 형태</text><text x="180" y="790" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="0" opacity="1">※ 슬라이드 번호와 발표자 전환 흐름을 유지하기 위해 빈 자리를 남깁니다.</text></svg>