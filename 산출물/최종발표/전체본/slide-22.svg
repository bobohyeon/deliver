315BD8" text-anchor="middle" letter-spacing="0" opacity="1">03</text><text x="815" y="708" font-family="NotoKR, Arial, sans-serif" font-size="23" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">실제 비교 결과</text><text x="815" y="743" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">근거가 남은 실제 수치</text><rect x="1270" y="620" width="430" height="150" rx="22" fill="#F8FAFD" stroke="#DCE5F1" stroke-width="2" opacity="1" /><rect x="1295" y="645" width="62" height="34" rx="17.0" fill="#E7EEFF" stroke="none" stroke-width="0" opacity="1" /><text x="1326.0" y="667.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#3BC7F4" text-anchor="middle" letter-spacing="0" opacity="1">04</text><text x="1295" y="708" font-family="NotoKR, Arial, sans-serif" font-size="23" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">제품에 적용한 모델</text><text x="1295" y="743" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">적용 모델과 남은 한계</text><text x="960" y="955" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#64748B" text-anchor="middle" letter-spacing="0" opacity="1">슬라이드 번호와 발표 흐름은 유지하고, 내용만 세현님 최종본으로 교체</text></svg>