<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E162F" flood-opacity="0.11"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0E162F" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FC" stroke="none" stroke-width="0" opacity="1" /><text x="80" y="60" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="2" opacity="1">22  /  박세현 발표 자료</text><text x="1840" y="60" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="end" letter-spacing="2.6" opacity="0.62">TASQRA</text><line x1="80" y1="1015" x2="1840" y2="1015" stroke="#DCE5F1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1" opacity="1">발표  박세현</text><text x="1840" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="end" letter-spacing="1" opacity="1">담당  박세현</text><text x="80" y="125" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.6" opacity="1">최종 자료 반영 예정</text><text x="80" y="195" font-family="NotoKR, Arial, sans-serif" font-size="48" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="-0.8" opacity="1">박세현 작성 예정</text><text x="82" y="245" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">세현님이 정리한 최종 학습 결과로 교체할 슬라이드입니다.</text><rect x="90" y="300" width="1740" height="600" rx="30" fill="#FFFFFF" stroke="#315BD8" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="130" y="340" width="610" height="520" rx="28" fill="#16234A" stroke="#31477A" stroke-width="2" opacity="1" /><text x="175" y="400" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="1.7" opacity="1">22번 슬라이드</text><text x="175" y="495" font-family="NotoKR, Arial, sans-serif" font-size="64" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">박세현</text><text x="175" y="560" font-family="NotoKR, Arial, sans-serif" font-size="42" font-weight="800" font-style="normal" fill="#3BC7F4" text-anchor="start" letter-spacing="0" opacity="1">작성 영역</text><text x="175" y="625" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="500" font-style="normal" fill="#BFCBE5" text-anchor="start" letter-spacing="0" opacity="1">최종 자료 수신 후 이 페이지를</text><text x="175" y="660" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="500" font-style="normal" fill="#BFCBE5" text-anchor="start" letter-spacing="0" opacity="1">동일 디자인 규칙으로 교체합니다.</text><rect x="175" y="750" width="260" height="44" rx="22.0" fill="#243866" stroke="none" stroke-width="0" opacity="1" /><text x="305.0" y="777.44" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#C9E85B" text-anchor="middle" letter-spacing="0" opacity="1">최종 자료 대기 중</text><text x="790" y="380" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.4" opacity="1">권장 구성</text><rect x="790" y=