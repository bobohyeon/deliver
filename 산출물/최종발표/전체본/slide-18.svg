ll="#C9E85B"/><circle cx="1696.32" cy="410.68" r="2.88" fill="#C9E85B"/></g><text x="1280" y="456" font-family="NotoKR, Arial, sans-serif" font-size="30" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">두 결과를 읽는 순서로 합치기</text><text x="1280" y="506" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="500" fill="#C8D4EC" text-anchor="start"><tspan x="1280" dy="0">기존 글자와 이미지 글자</tspan><tspan x="1280" dy="30.0">페이지 위치에 맞춰 정렬</tspan></text><line x1="610" y1="525" x2="655" y2="525" stroke="#A9BADA" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 640 514 L 655 525 L 640 536" fill="none" stroke="#A9BADA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="1185" y1="525" x2="1230" y2="525" stroke="#A9BADA" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 1215 514 L 1230 525 L 1215 536" fill="none" stroke="#A9BADA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="775" width="1650" height="140" rx="26" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" filter="url(#softShadow)"/><text x="145" y="830" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.2" opacity="1">결과</text><text x="145" y="875" font-family="NotoKR, Arial, sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">페이지 본문 + 사람이 고칠 수 있는 글자 영역 + 원문에서의 시작·끝 위치</text><text x="1430" y="875" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#64748B" text-anchor="middle" letter-spacing="0" opacity="1">기존 글자 / 스캔 글자 / 두 결과 합치기</text></svg>