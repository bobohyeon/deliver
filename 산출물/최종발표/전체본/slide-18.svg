<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:NotoKR;src:url("../../포트폴리오/NotoSansKR.ttf") format("truetype");} text{font-family:NotoKR,Arial,sans-serif;}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E162F" flood-opacity="0.11"/></filter><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0E162F" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FC" stroke="none" stroke-width="0" opacity="1" /><text x="80" y="60" font-family="NotoKR, Arial, sans-serif" font-size="17" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="2" opacity="1">18  /  문서 글자 읽기</text><text x="1840" y="60" font-family="NotoKR, Arial, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="end" letter-spacing="2.6" opacity="0.62">TASQRA</text><line x1="80" y1="1015" x2="1840" y2="1015" stroke="#DCE5F1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="start" letter-spacing="1" opacity="1">발표  박세현</text><text x="1840" y="1050" font-family="NotoKR, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#64748B" text-anchor="end" letter-spacing="1" opacity="1">담당  박세현</text><text x="80" y="125" font-family="NotoKR, Arial, sans-serif" font-size="18" font-weight="800" font-style="normal" fill="#315BD8" text-anchor="start" letter-spacing="1.6" opacity="1">페이지에 맞는 읽기 방법 선택</text><text x="80" y="195" font-family="NotoKR, Arial, sans-serif" font-size="46" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="-0.8" opacity="1">PDF에 이미 들어 있는 글자를 살려서 읽습니다</text><text x="82" y="245" font-family="NotoKR, Arial, sans-serif" font-size="22" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" letter-spacing="0" opacity="1">글자가 있으면 그대로 쓰고, 스캔 이미지는 글자를 인식하며, 둘 다 있으면 읽는 순서에 맞춰 합칩니다.</text><rect x="100" y="340" width="500" height="370" rx="26" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="100" y="340" width="500" height="10" rx="5" fill="#315BD8" stroke="none" stroke-width="0" opacity="1" /><rect x="128" y="372" width="62" height="34" rx="17.0" fill="#E7EEFF" stroke="none" stroke-width="0" opacity="1" /><text x="159.0" y="394.1" font-family="NotoKR, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#315BD8" text-anchor="middle" letter-spacing="0" opacity="1">기존 글자 사용</text><circle cx="538" cy="403" r="35" fill="#EAF0FA" stroke="#315BD8" stroke-width="2" opacity="1" /><g fill="none" stroke="#315BD8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="529.2" y="392.12" width="17.6" height="21.76" rx="5"/><path d="M 540.08 392.12 v 5.44 h 6.72"/><line x1="532.72" y1="402.52" x2="542.6400000000001" y2="402.52"/><line x1="532.72" y1="406.68" x2="540.72" y2="406.68"/></g><text x="130" y="456" font-family="NotoKR, Arial, sans-serif" font-size="30" font-weight="800" font-style="normal" fill="#0F172A" text-anchor="start" letter-spacing="0" opacity="1">PDF의 기존 글자 보존</text><text x="130" y="506" font-family="NotoKR, Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start"><tspan x="130" dy="0">들어 있는 글자 읽기</tspan><tspan x="130" dy="30.0">이미지 글자 인식 생략</tspan></text><rect x="675" y="340" width="500" height="370" rx="26" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" opacity="1" filter="url(#softShadow)"/><rect x="675" y="340" width="500" height="10" rx="5" fill="#3BC7F4" stroke="none" stroke-width="0" opacity="1" /><rect x="703" y="372" width="62" height="34" rx="17.0" fill="#E7E