<!doctype html>
<!--
  Tasqra 메인 랜딩 히어로 v2
  - 사용자가 직접 준 "tasqra-landing-section" 문서를 그대로 가져왔다(디자인 창작 없이 카피).
    v1(내가 임의로 만든 Tailwind 버전)은 배경에 반도체 사진을 넣는 등 시안과 달라서 폐기.
  - CSS만으로 그린 정적 HTML. 외부 CDN·웹폰트·이미지 요청이 전혀 없다 — 더블클릭으로
    바로 열리고, 네트워크가 막힌 환경에서도 100% 동일하게 보인다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tasqra 메인 랜딩 기능 허브 섹션">
  <title>Tasqra — 기능 허브 소개</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-50: #eff6ff;
      --blue-100: #dbeafe;
      --heading: #0f172a;
      --body: #475569;
      --muted: #64748b;
      --line: #e2e8f0;
      --surface: #f8fafc;
      --white: #ffffff;
      --shadow: 0 18px 52px rgba(37, 99, 235, 0.10);
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 78% 22%, rgba(147, 197, 253, .20), transparent 30%),
        #f4f7fb;
      color: var(--body);
      /* 한글 전용 폰트(맑은 고딕/Apple SD Gothic Neo/Noto Sans KR)를 시스템 UI 폰트보다
         앞에 둔다 — Segoe UI 등 일부 시스템 폰트는 한글 자리에 빈 사각형(notdef) 글리프를
         갖고 있어서, 브라우저가 자동으로 다른 폰트로 넘기지 않고 그 빈 사각형을 그대로
         쓰는 경우가 있다(h1처럼 특이한 font-weight일 때 특히 잘 드러난다). 실제로 그렇게
         제목만 깨져 보인다는 피드백을 받고 순서를 바꿨다. */
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR",
        -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .site {
      padding: 0 34px 34px;
      background: rgba(255, 255, 255, .96);
    }

    .site-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 76px;
      border-bottom: 1px solid #f1f5f9;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      width: fit-content;
      color: var(--heading);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(145deg, #4f8bfb, #2563eb);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      font-style: normal;
      font-family: Arial, "Helvetica Neue", sans-serif;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
    }

    .nav a:hover, .login:hover { color: var(--blue); }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 20px;
      border: 1px solid var(--blue);
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 9px 22px rgba(37, 99, 235, .18);
      transition: transform .16s ease, background .16s ease;
    }

    .button svg { width: 15px; height: 15px; }

    .button:hover { background: var(--blue-dark); transform: translateY(-1px); }
    .button-small { min-height: 38px; padding-inline: 16px; font-size: 12px; box-shadow: none; }
    .button-outline { border-color: #cbd5e1; background: #fff; color: #334155; box-shadow: none; }
    .button-outline:hover { border-color: #93c5fd; background: var(--blue-50); color: var(--blue-dark); }

    .hero {
      display: grid;
      grid-template-columns: minmax(360px, .9fr) minmax(520px, 1.1fr);
      gap: 58px;
      align-items: center;
      min-height: 450px;
      padding: 55px 0 38px;
    }

    .hero-copy h1 {
      margin: 0;
      color: var(--heading);
      font-size: clamp(40px, 4.2vw, 58px);
      line-height: 1.18;
      letter-spacing: -.06em;
      font-weight: 800;
    }

    .hero-copy h1 strong { color: var(--blue); font-weight: inherit; }

    .hero-copy p {
      max-width: 470px;
      margin: 22px 0 0;
      color: var(--body);
      font-size: 15px;
      line-height: 1.75;
      letter-spacing: -.02em;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    .hub {
      position: relative;
      display: grid;
      grid-template-columns: 150px 52px 150px 1fr;
      align-items: center;
      min-height: 330px;
    }

    .upload-card {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 190px;
      padding: 18px;
      border: 1px dashed #bfdbfe;
      border-radius: 14px;
      background: rgba(255, 255, 255, .94);
      text-align: center;
      box-shadow: 0 12px 28px rgba(15, 23, 42, .05);
    }

    .document-icon {
      width: 44px;
      height: 52px;
      margin-bottom: 14px;
      color: var(--blue);
    }

    .upload-card strong, .result-card strong {
      color: var(--heading);
      font-size: 12px;
    }

    .upload-card span {
      margin-top: 7px;
      color: var(--muted);
      font-size: 10px;
    }

    .upload-symbol {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      margin-top: 14px;
      border-radius: 50%;
      background: var(--blue-50);
      color: var(--muted);
    }

    .upload-symbol svg { width: 15px; height: 15px; }

    .arrow {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      color: var(--blue);
    }

    .arrow svg { width: 22px; height: 22px; }

    /* 중앙 허브 아이콘: 바깥(옅게 퍼지는 글로우 2겹) → 흰 원(halo) → 45도 회전한
       둥근 사각형(스퀄클) 그라디언트 다이아몬드 → 안에서 다시 -45도 되돌려 세운 굵은 T.
       사용자가 지적한 "로고가 다르다"는 정확히 이 부분(예전엔 이탤릭 T + 육각형)이었다. */
    .core {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 210px;
      height: 210px;
    }

    .core-glow {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 197, 253, .30), rgba(147, 197, 253, 0) 70%);
    }

    .core-glow-outer { width: 210px; height: 210px; opacity: .6; }
    .core-glow-inner { width: 148px; height: 148px; opacity: .75; }

    .core-halo {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 18px 40px rgba(37, 99, 235, .18), 0 0 0 1px rgba(219, 234, 254, .7);
    }

    .core-square {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      border-radius: 22px;
      background: linear-gradient(145deg, #60a5fa, #3b82f6);
      box-shadow: 0 12px 22px rgba(59, 130, 246, .3);
    }

    .core-letter {
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      font-style: normal;
      font-family: Arial, "Helvetica Neue", sans-serif;
      line-height: 1;
    }

    .results {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 13px;
      padding-left: 46px;
    }

    .result-card {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
      min-height: 82px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 10px 24px rgba(15, 23, 42, .06);
    }

    /* 허브(T 로고) -> 카드 3개 연결선. 카드가 위/중간/아래로 벌어져 있어서 허브
       중심에서 곧은 직선으로는 위·아래 카드에 닿을 수 없다 — 그래서 점선을
       ㄱ자로 한 번 꺾어서(수평→수직→수평) 각 카드 높이에 맞춘다. 중간 카드는
       허브와 높이가 같아서 꺾임 없이 그대로 수평이다. */
    .connectors {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    .connectors path {
      fill: none;
      stroke: #bfdbfe;
      stroke-width: 1.5;
      stroke-dasharray: 3 4;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .connectors circle {
      fill: var(--blue);
      vector-effect: non-scaling-stroke;
    }

    .result-icon {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--blue-100);
      color: var(--blue);
    }

    .result-icon svg { width: 18px; height: 18px; }

    .result-card p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .feature-chips {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      max-width: 650px;
      padding-top: 18px;
    }

    .feature-chip {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 64px;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--heading);
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(15, 23, 42, .045);
    }

    .chip-icon {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--blue-100);
      color: var(--blue);
    }

    .chip-icon svg { width: 17px; height: 17px; }

    @media (max-width: 980px) {
      .site-header { grid-template-columns: 1fr auto; }
      .nav { display: none; }
      .hero { grid-template-columns: 1fr; gap: 28px; }
      .hero-copy { text-align: center; }
      .hero-copy p { margin-inline: auto; }
      .hero-actions, .feature-chips { justify-content: center; margin-inline: auto; }
      .hub { max-width: 690px; margin-inline: auto; }
    }

    @media (max-width: 700px) {
      .page { width: min(100% - 20px, 1180px); margin-block: 10px; }
      .concept-label { padding-inline: 18px; font-size: 13px; }
      .site { padding: 0 18px 22px; }
      .header-actions .login { display: none; }
      .hero { padding-top: 36px; }
      .hero-copy { text-align: left; }
      .hero-copy h1 { font-size: clamp(36px, 11vw, 48px); }
      .hero-copy p { margin-inline: 0; }
      .hero-actions { display: grid; margin-inline: 0; }
      .hub { grid-template-columns: 1fr; gap: 18px; }
      .upload-card { min-height: 160px; }
      .arrow { transform: rotate(90deg); }
      .core { margin: 20px auto; }
      .results { padding-left: 0; }
      .result-card::before, .result-card::after { display: none; }
      .feature-chips { grid-template-columns: 1fr; max-width: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
      <div class="site">
        <header class="site-header">
          <a class="brand" href="#" aria-label="Tasqra 홈">
            <span class="brand-mark" aria-hidden="true">T</span>
            <span>Tasqra</span>
          </a>

          <nav class="nav" aria-label="주요 메뉴">
            <a href="#features">기능</a>
            <a href="#pricing">요금제</a>
            <a href="#customers">고객사</a>
            <a href="#resources">리소스⌄</a>
          </nav>

          <div class="header-actions">
            <a class="login" href="#login">로그인</a>
            <a class="button button-small" href="#start">무료로 시작하기
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
            </a>
          </div>
        </header>

        <div class="hero">
          <div class="hero-copy">
            <h1>복잡한 문서를<br>명확한 <strong>실행으로</strong></h1>
            <p>AI가 문서의 핵심을 분석하고,<br>프로젝트와 태스크로 전환해 실행까지 지원합니다.</p>
            <div class="hero-actions">
              <a class="button" href="#start">무료로 시작하기
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
              </a>
              <a class="button button-outline" href="#features">기능 알아보기</a>
            </div>
          </div>

          <div class="hub" role="img" aria-label="문서를 업로드하면 Tasqra가 프로젝트, 태스크와 일정, 핵심 요약을 생성하는 흐름">
            <svg class="connectors" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <path d="M58,50 H78 V21 H96"/>
              <path d="M58,50 H96"/>
              <path d="M58,50 H78 V79 H96"/>
              <circle cx="96" cy="21" r="1.4"/>
              <circle cx="96" cy="50" r="1.4"/>
              <circle cx="96" cy="79" r="1.4"/>
            </svg>
            <div class="upload-card">
              <svg class="document-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/>
                <path d="M14 2v6h6"/>
                <path d="M8 13h8M8 17h5"/>
              </svg>
              <strong>문서 드롭존 &amp; 업로드</strong>
              <span>PDF, DOCX, HWP, XLSX 등</span>
              <span class="upload-symbol" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
              </span>
            </div>

            <div class="arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
            </div>

            <div class="core" aria-hidden="true">
              <span class="core-glow core-glow-outer"></span>
              <span class="core-glow core-glow-inner"></span>
              <span class="core-halo">
                <span class="core-square"><span class="core-letter">T</span></span>
              </span>
            </div>

            <div class="results">
              <article class="result-card">
                <span class="result-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
                </span>
                <div><strong>프로젝트 생성</strong><p>문서 기반으로 프로젝트 구조를 자동 구성</p></div>
              </article>
              <article class="result-card">
                <span class="result-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="m8 12 2.5 2.5L16 9"/></svg>
                </span>
                <div><strong>태스크 및 일정 생성</strong><p>WBS 기반 태스크와 일정을 자동 생성</p></div>
              </article>
              <article class="result-card">
                <span class="result-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
                </span>
                <div><strong>핵심 요약 제공</strong><p>핵심 내용과 요구사항을 요약해 제공</p></div>
              </article>
            </div>
          </div>
        </div>

        <div class="feature-chips" id="features">
          <div class="feature-chip">
            <span class="chip-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 15h1M14 15h1M9 11h1M14 11h1"/></svg>
            </span>
            정확한 OCR
          </div>
          <div class="feature-chip">
            <span class="chip-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 15.5A2 2 0 0 0 8.5 14.1l-6.1-1.6a.5.5 0 0 1 0-1L8.5 9.9A2 2 0 0 0 9.9 8.5l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/></svg>
            </span>
            AI 분석
          </div>
          <div class="feature-chip">
            <span class="chip-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            </span>
            자동 프로젝트 생성
          </div>
        </div>
      </div>
  </main>
</body>
</html>
