<!doctype html>
<!--
  Tasqra 메인 랜딩 히어로 v2
  - 사용자가 직접 준 "tasqra-landing-section" 문서를 그대로 가져왔다(디자인 창작 없이 카피).
    v1(내가 임의로 만든 Tailwind 버전)은 배경에 반도체 사진을 넣는 등 시안과 달라서 폐기.
  - CSS만으로 그린 정적 HTML. 외부 CDN·웹폰트·이미지 요청이 전혀 없다 — 더블클릭으로
    바로 열리고, 네트워크가 막힌 환경에서도 100% 동일하게 보인다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tasqra 메인 랜딩 기능 허브 섹션">
  <title>Tasqra — 기능 허브 소개</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-50: #eff6ff;
      --blue-100: #dbeafe;
      --heading: #0f172a;
      --body: #475569;
      --muted: #64748b;
      --line: #e2e8f0;
      --surface: #f8fafc;
      --white: #ffffff;
      --shadow: 0 18px 52px rgba(37, 99, 235, 0.10);
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 78% 22%, rgba(147, 197, 253, .20), transparent 30%),
        #f4f7fb;
      color: var(--body);
      /* 한글 전용 폰트(맑은 고딕/Apple SD Gothic Neo/Noto Sans KR)를 시스템 UI 폰트보다
         앞에 둔다 — Segoe UI 등 일부 시스템 폰트는 한글 자리에 빈 사각형(notdef) 글리프를
         갖고 있어서, 브라우저가 자동으로 다른 폰트로 넘기지 않고 그 빈 사각형을 그대로
         쓰는 경우가 있다(h1처럼 특이한 font-weight일 때 특히 잘 드러난다). 실제로 그렇게
         제목만 깨져 보인다는 피드백을 받고 순서를 바꿨다. */
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR",
        -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }

    .page {
      width: min(1240px, calc(100% - 24px));
      margin: 0 auto;
    }

    .site {
      padding: 0 20px 22px;
      background: rgba(255, 255, 255, .96);
    }

    .site-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 58px;
      border-bottom: 1px solid #f1f5f9;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      width: fit-content;
      color: var(--heading);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(145deg, #4f8bfb, #2563eb);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      font-style: normal;
      font-family: Arial, "Helvetica Neue", sans-serif;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
    }

    .nav a:hover, .login:hover { color: var(--blue); }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      padding: 0 16px;
      border: 1px solid var(--blue);
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 7px 16px rgba(37, 99, 235, .15);
      transition: transform .16s ease, background .16s ease;
    }

    .button svg { width: 13px; height: 13px; }

    .button:hover { background: var(--blue-dark); transform: translateY(-1px); }
    .button-small { min-height: 32px; padding-inline: 13px; font-size: 11px; box-shadow: none; }
    .button-outline { border-color: #cbd5e1; background: #fff; color: #334155; box-shadow: none; }
    .button-outline:hover { border-color: #93c5fd; background: var(--blue-50); color: var(--blue-dark); }

    .hero {
      display: grid;
      grid-template-columns: minmax(300px, .74fr) minmax(0, 1.26fr);
      gap: 0;
      align-items: center;
      padding: 12px 0 8px;
    }

    .hero-copy h1 {
      margin: 0;
      color: var(--heading);
      font-size: clamp(32px, 3.4vw, 44px);
      line-height: 1.2;
      /* letter-spacing -.01em 으로 줄여도 네모(tofu)가 그대로 남았다 — 자간 하나
         만의 문제가 아니라, 음수 자간 자체 + 이 글자 크기(40~58px) + 굵기 800의
         조합에서 브라우저 텍스트 셰이핑이 깨지는 것으로 보인다. 원인을 좁히기
         위해 자간을 완전히 제거(normal)한다. 한글 제목은 자간을 안 좁혀도
         Latin 제목만큼 헐렁해 보이지 않는다. */
      letter-spacing: normal;
      font-weight: 800;
    }

    .hero-copy h1 strong { color: var(--blue); font-weight: inherit; }

    .hero-copy p {
      max-width: 420px;
      margin: 10px 0 0;
      color: var(--body);
      font-size: 13px;
      line-height: 1.55;
      letter-spacing: -.01em;
    }

    .hero-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .hub-image {
      position: relative;
      height: 350px;
      overflow: hidden;
    }

    .hub-image img {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(680px, 110%);
      max-width: none;
      height: auto;
      display: block;
      transform: translate(-50%, -50%);
    }

    .features-section {
      padding: 14px 0 20px;
      border-top: 1px solid #f1f5f9;
    }

    .features-title {
      margin: 0 0 11px;
      color: var(--heading);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .feature-chips {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .feature-chip {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      grid-template-rows: auto auto;
      column-gap: 11px;
      row-gap: 3px;
      align-items: center;
      min-height: 78px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(15, 23, 42, .04);
    }

    .chip-icon {
      display: grid;
      grid-row: 1 / 3;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--blue-100);
      color: var(--blue);
    }

    .chip-icon svg { width: 18px; height: 18px; }

    .feature-chip strong {
      align-self: end;
      color: var(--heading);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .feature-chip p {
      align-self: start;
      margin: 0;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.35;
    }

    @media (max-width: 860px) {
      .site-header { grid-template-columns: 1fr auto; }
      .nav { display: none; }
      .hero { grid-template-columns: 1fr; gap: 0; }
      .hero-copy { padding-top: 22px; text-align: center; }
      .hero-copy p { margin-inline: auto; }
      .hero-actions { justify-content: center; margin-inline: auto; }
      .hub-image { height: 360px; }
      .hub-image img { width: min(620px, 115%); }
      .feature-chips { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .page { width: min(100% - 16px, 1240px); margin-block: 8px; }
      .site { padding: 0 12px 18px; }
      .header-actions .login { display: none; }
      .hero { padding-top: 18px; }
      .hero-copy { padding-top: 0; text-align: left; }
      .hero-copy h1 { font-size: clamp(30px, 9.5vw, 38px); }
      .hero-copy p { margin-inline: 0; }
      .hero-actions { display: grid; margin-inline: 0; }
      .hub-image { height: 330px; }
      .hub-image img { width: 560px; }
      .feature-chips { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
      <div class="site">
        <header class="site-header">
          <a class="brand" href="#" aria-label="Tasqra 홈">
            <span class="brand-mark" aria-hidden="true">T</span>
            <span>Tasqra</span>
          </a>

          <nav class="nav" aria-label="주요 메뉴">
            <a href="#features">기능</a>
            <a href="#pricing">요금제</a>
            <a href="#customers">고객사</a>
            <a href="#resources">리소스⌄</a>
          </nav>

          <div class="header-actions">
            <a class="login" href="#login">로그인</a>
            <a class="button button-small" href="#start">무료로 시작하기
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
            </a>
          </div>
        </header>

        <div class="hero">
          <div class="hero-copy">
            <h1>복잡한 문서를<br>명확한 <strong>실행으로</strong></h1>
            <p>AI가 문서의 핵심을 분석하고,<br>프로젝트와 태스크로 전환해 실행까지 지원합니다.</p>
            <div class="hero-actions">
              <a class="button" href="#start">무료로 시작하기
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
              </a>
              <a class="button button-outline" href="#features">기능 알아보기</a>
            </div>
          </div>

          <!-- CSS/SVG로 정확히 재현하기 어려운 부분(글로우·연결선 각도·아이콘 배치)이라
               디자이너가 만든 완성 이미지 한 장을 그대로 쓴다. assets/hero-flow.jpg -->
          <div class="hub-image">
            <img src="assets/hero-flow.jpg" alt="문서를 업로드하면 Tasqra가 프로젝트 생성, 태스크 및 일정 생성, 핵심 요약 제공으로 이어지는 흐름"/>
          </div>
        </div>

        <section class="features-section" id="features">
          <h2 class="features-title">Tasqra의 핵심 기능</h2>
          <div class="feature-chips">
            <div class="feature-chip">
              <span class="chip-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 15h1M14 15h1M9 11h1M14 11h1"/></svg>
              </span>
              <strong>정확한 OCR</strong>
              <p>다양한 형식의 문서를 높은 정확도로 인식</p>
            </div>
            <div class="feature-chip">
              <span class="chip-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 15.5A2 2 0 0 0 8.5 14.1l-6.1-1.6a.5.5 0 0 1 0-1L8.5 9.9A2 2 0 0 0 9.9 8.5l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/></svg>
              </span>
              <strong>AI 문서 분석</strong>
              <p>핵심 내용과 요구사항을 자동으로 추출</p>
            </div>
            <div class="feature-chip">
              <span class="chip-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
              </span>
              <strong>프로젝트 자동 생성</strong>
              <p>분석 결과를 바탕으로 프로젝트와 태스크 구성</p>
            </div>
            <div class="feature-chip">
              <span class="chip-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 15c2.5 0 5 1.6 5 5"/></svg>
              </span>
              <strong>협업 및 추적 관리</strong>
              <p>진행 상황을 한눈에 확인하고 효율적으로 업무</p>
            </div>
          </div>
        </section>
      </div>
  </main>
</body>
</html>
