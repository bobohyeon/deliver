<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" role="img" aria-labelledby="title desc"><title id="title">SCR-002 로그인</title><desc id="desc">Tasqra 로그인 화면 설계</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e162f"/><stop offset="1" stop-color="#223672"/></linearGradient><style>@font-face{font-family:'Noto Sans KR';src:url('../포트폴리오/NotoSansKR.ttf') format('truetype');font-weight:100 900}text{font-family:'Noto Sans KR',Pretendard,'Malgun Gothic',sans-serif}.h1{font-size:49px;font-weight:800}.h2{font-size:38px;font-weight:800;fill:#0f172a}.body{font-size:21px}.label{font-size:18px;font-weight:700;fill:#334155}.pin circle{fill:#315bd8;stroke:#fff;stroke-width:4}.pin text{fill:#fff;font-size:19px;font-weight:800;text-anchor:middle;dominant-baseline:middle}</style></defs><rect width="1440" height="1024" fill="#f5f7fb"/><rect x="0" width="665" height="1024" fill="url(#brand)"/><text x="70" y="72" font-size="32" font-weight="900" fill="#fff">Tasqra</text><text x="80" y="248" font-size="17" font-weight="900" letter-spacing="3" fill="#9fb5ff">DOCUMENT TO PROJECT</text><text class="h1" x="80" y="324" fill="#fff">문서의 맥락을 잃지 않고</text><text class="h1" x="80" y="392" fill="#fff">실행까지 연결하세요.</text><text class="body" x="80" y="459" fill="#cbd5e1">OCR 검수, AI 분석, 프로젝트 업무와 산출물을</text><text class="body" x="80" y="494" fill="#cbd5e1">하나의 흐름으로 관리합니다.</text><circle cx="333" cy="674" r="110" fill="#315bd8" opacity=".8"/><text x="333" y="702" text-anchor="middle" font-size="78" font-weight="900" fill="#fff">T</text><g font-size="18" font-weight="700" fill="#e2e8f0"><text x="80" y="886">✓  원문과 분석 근거 연결</text><text x="80" y="925">✓  프로젝트별 안전한 권한 관리</text><text x="80" y="964">✓  검토와 변경 이력 보존</text></g><rect x="818" y="151" width="480" height="724" rx="24" fill="#fff" stroke="#e2e8f0"/><text x="872" y="224" font-size="15" font-weight="900" letter-spacing="2" fill="#315bd8">WELCOME TO TASQRA</text><text class="h2" x="872" y="282">다시 만나 반가워요.</text><text class="body" x="872" y="326" fill="#64748b">계정으로 로그인하고 오늘의 프로젝트를 확인하세요.</text><text class="label" x="872" y="404">아이디</text><rect x="872" y="425" width="372" height="60" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="894" y="463" font-size="18" fill="#94a3b8">아이디를 입력하세요</text><text class="label" x="872" y="548">비밀번호</text><rect x="872" y="569" width="372" height="60" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="894" y="607" font-size="18" fill="#94a3b8">8자 이상 입력하세요</text><rect x="872" y="674" width="372" height="60" rx="9" fill="#315bd8"/><text x="1058" y="712" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">로그인</text><text x="928" y="786" font-size="18" fill="#64748b">아직 계정이 없으신가요?</text><text x="1154" y="786" font-size="18" font-weight="800" fill="#315bd8">회원가입</text><g class="pin"><g transform="translate(55 66)"><circle r="18"/><text y="1">1</text></g><g transform="translate(66 229)"><circle r="18"/><text y="1">2</text></g><g transform="translate(802 204)"><circle r="18"/><text y="1">3</text></g><g transform="translate(855 390)"><circle r="18"/><text y="1">4</text></g><g transform="translate(855 659)"><circle r="18"/><text y="1">5</text></g><g transform="translate(910 780)"><circle r="18"/><text y="1">6</text></g></g></svg>