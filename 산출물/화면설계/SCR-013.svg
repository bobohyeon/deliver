<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" role="img" aria-labelledby="title desc"><title id="title">SCR-013 금액 현황과 금액 검토</title><desc id="desc">금액 합계, 승인 대기, 승인 항목과 검산 화면 설계</desc><defs><style>@font-face{font-family:'Noto Sans KR';src:url('../포트폴리오/NotoSansKR.ttf') format('truetype');font-weight:100 900}text{font-family:'Noto Sans KR',Pretendard,'Malgun Gothic',sans-serif}.title{font-size:34px;font-weight:850;fill:#0f172a}.h2{font-size:20px;font-weight:800;fill:#0f172a}.body{font-size:14px;fill:#475569}.small{font-size:12px;fill:#64748b}.nav{font-size:16px;font-weight:700;fill:#cbd5e1}.pin circle{fill:#315bd8;stroke:#fff;stroke-width:4}.pin text{fill:#fff;font-size:19px;font-weight:800;text-anchor:middle;dominant-baseline:middle}</style></defs><rect width="1440" height="1024" fill="#f5f7fb"/><rect width="262" height="1024" fill="#0e162f"/><text x="32" y="48" font-size="28" font-weight="900" fill="#fff">Tasqra</text><text x="28" y="102" font-size="13" font-weight="800" fill="#9fb5ff">도로 정비 사업</text><g class="nav"><text x="42" y="172">▦  대시보드</text><text x="42" y="222">▤  문서</text><text x="42" y="272">⌕  검색</text><text x="42" y="322">▦  보드</text><rect x="18" y="344" width="226" height="42" rx="9" fill="#315bd8" opacity=".25"/><text x="42" y="372" fill="#fff">₩  금액</text><text x="42" y="422">▣  산출물</text><text x="42" y="472">⚙  설정</text></g><rect x="262" width="1178" height="64" fill="#fff"/><text x="296" y="41" font-size="17" fill="#64748b">워크스페이스  ›  도로 정비 사업  ›  금액</text><text class="title" x="296" y="130">금액 현황</text><text class="body" x="296" y="162">문서에서 추출한 금액을 검토하고 프로젝트 합계를 확인하세요.</text><g transform="translate(296 198)"><g fill="#fff" stroke="#e2e8f0"><rect width="348" height="116" rx="14"/><rect x="376" width="348" height="116" rx="14"/><rect x="752" width="348" height="116" rx="14"/></g><g class="body"><text x="22" y="37">항목 합계</text><text x="398" y="37">부가가치세</text><text x="774" y="37">합계</text></g><g font-size="31" font-weight="850" fill="#0f172a"><text x="22" y="82">120,000,000원</text><text x="398" y="82">12,000,000원</text><text x="774" y="82" fill="#315bd8">132,000,000원</text></g></g><rect x="296" y="338" width="1100" height="140" rx="14" fill="#fff" stroke="#e2e8f0"/><text class="h2" x="322" y="380">무엇을 집계했나</text><g class="body"><text x="322" y="422">담긴 항목 12건</text><text x="520" y="422">문서 4건</text><text x="708" y="422">금액 없음 1건</text><text x="914" y="422">검산 불가 2건</text></g><rect x="296" y="502" width="1100" height="226" rx="14" fill="#fff" stroke="#e2e8f0"/><text class="h2" x="322" y="544">승인 대기 3건</text><g font-size="12" font-weight="800" fill="#64748b"><text x="322" y="582">항목</text><text x="620" y="582">원가구분</text><text x="760" y="582">수량 × 단가</text><text x="932" y="582">문서 금액</text><text x="1080" y="582">검산</text><text x="1260" y="582">처리</text></g><path d="M322 598H1370" stroke="#e2e8f0"/><g class="body"><text x="322" y="630">아스팔트 포장</text><text x="620" y="630">재료비</text><text x="760" y="630">1 × 45,000,000</text><text x="932" y="630">45,000,000</text><text x="1080" y="630" fill="#237248">일치</text><text x="322" y="682">배수로 정비</text><text x="620" y="682">공사비</text><text x="760" y="682">2 × 12,500,000</text><text x="932" y="682">25,000,000</text><text x="1080" y="682" fill="#9b6512">확인 필요</text></g><g font-size="13" font-weight="800"><text x="1238" y="630" fill="#237248">승인</text><text x="1292" y="630" fill="#aa3445">거절</text><text x="1238" y="682" fill="#237248">승인</text><text x="1292" y="682" fill="#aa3445">거절</text></g><rect x="296" y="752" width="1100" height="214" rx="14" fill="#fff" stroke="#e2e8f0"/><text class="h2" x="322" y="794">승인 항목</text><g transform="translate(936 770)"><rect width="84" height="36" rx="8" fill="#eef2ff"/><text x="42" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#315bd8">전체</text><text x="122" y="24" font-size="13" fill="#64748b">어긋난 항목</text><text x="228" y="24" font-size="13" fill="#64748b">검산 불가</text><text x="320" y="24" font-size="13" fill="#64748b">금액 없음</text></g><g class="body"><text x="322" y="840">교통 통제 인력</text><text x="620" y="840">노무비</text><text x="770" y="840">4 × 2,500,000원</text><text x="1030" y="840" fill="#237248">검산 일치</text><text x="322" y="900">안전 표지판</text><text x="620" y="900">재료비</text><text x="770" y="900">10 × 350,000원</text><text x="1030" y="900" fill="#237248">검산 일치</text></g><text x="1250" y="840" font-size="13" font-weight="800" fill="#315bd8">수정</text><text x="1308" y="840" font-size="13" font-weight="800" fill="#aa3445">취소</text><g class="pin"><g transform="translate(18 345)"><circle r="18"/><text y="1">1</text></g><g transform="translate(280 104)"><circle r="18"/><text y="1">2</text></g><g transform="translate(280 198)"><circle r="18"/><text y="1">3</text></g><g transform="translate(280 338)"><circle r="18"/><text y="1">4</text></g><g transform="translate(280 502)"><circle r="18"/><text y="1">5</text></g><g transform="translate(1222 610)"><circle r="18"/><text y="1">6</text></g><g transform="translate(280 752)"><circle r="18"/><text y="1">7</text></g></g></svg>