<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" role="img" aria-labelledby="title desc"><title id="title">SCR-010 통합 검색</title><desc id="desc">문서 내용과 과거 단가 선례 검색 화면 설계</desc><defs><style>@font-face{font-family:'Noto Sans KR';src:url('../포트폴리오/NotoSansKR.ttf') format('truetype');font-weight:100 900}text{font-family:'Noto Sans KR',Pretendard,'Malgun Gothic',sans-serif}.title{font-size:34px;font-weight:850;fill:#0f172a}.h2{font-size:21px;font-weight:800;fill:#0f172a}.body{font-size:15px;fill:#475569}.small{font-size:12px;fill:#64748b}.nav{font-size:16px;font-weight:700;fill:#cbd5e1}.pin circle{fill:#315bd8;stroke:#fff;stroke-width:4}.pin text{fill:#fff;font-size:19px;font-weight:800;text-anchor:middle;dominant-baseline:middle}</style></defs><rect width="1440" height="1024" fill="#f5f7fb"/><rect width="262" height="1024" fill="#0e162f"/><text x="32" y="48" font-size="28" font-weight="900" fill="#fff">Tasqra</text><text x="28" y="102" font-size="13" font-weight="800" fill="#9fb5ff">도로 정비 사업</text><g class="nav"><text x="42" y="172">▦  대시보드</text><text x="42" y="222">▤  문서</text><rect x="18" y="244" width="226" height="42" rx="9" fill="#315bd8" opacity=".25"/><text x="42" y="272" fill="#fff">⌕  검색</text><text x="42" y="322">▦  보드</text><text x="42" y="372">₩  금액</text><text x="42" y="422">▣  산출물</text><text x="42" y="472">⚙  설정</text></g><rect x="262" width="1178" height="64" fill="#fff"/><text x="296" y="41" font-size="17" fill="#64748b">워크스페이스  ›  도로 정비 사업  ›  검색</text><g transform="translate(296 104)"><text class="title" x="0" y="34">검색</text><text class="body" x="0" y="66">프로젝트 문서에서 필요한 근거와 과거 단가를 찾으세요.</text></g><g transform="translate(296 202)"><rect width="1100" height="58" rx="11" fill="#fff" stroke="#e2e8f0"/><rect x="10" y="9" width="190" height="40" rx="8" fill="#eef2ff"/><text x="105" y="35" text-anchor="middle" font-size="15" font-weight="800" fill="#315bd8">문서 내용</text><text x="292" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">과거 단가 선례</text></g><rect x="296" y="282" width="1100" height="116" rx="14" fill="#fff" stroke="#e2e8f0"/><rect x="322" y="309" width="716" height="60" rx="10" fill="#fff" stroke="#315bd8" stroke-width="2"/><text x="348" y="346" font-size="18" fill="#334155">계약 변경 조건과 공사 완료 기한</text><rect x="1050" y="309" width="134" height="60" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="1117" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">이 프로젝트만 ⌄</text><rect x="1196" y="309" width="174" height="60" rx="10" fill="#315bd8"/><text x="1283" y="346" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">검색</text><text class="small" x="322" y="388">의미+키워드 검색 · 0.42초</text><rect x="296" y="420" width="1100" height="532" rx="14" fill="#fff" stroke="#e2e8f0"/><text class="h2" x="324" y="462">검색 결과 8건</text><g transform="translate(324 492)"><g fill="#f8fafc" stroke="#e2e8f0"><rect width="1044" height="190" rx="10"/><rect y="210" width="1044" height="190" rx="10"/></g><text class="h2" x="22" y="38">공사계약서_최종.pdf</text><text class="small" x="22" y="64">계약서 · 12쪽 · 3회 일치</text><rect x="810" y="18" width="96" height="28" rx="14" fill="#eef2ff"/><text x="858" y="37" text-anchor="middle" font-size="12" font-weight="800" fill="#315bd8">의미+키워드</text><text x="930" y="37" font-size="13" font-weight="800" fill="#315bd8">유사도 92%</text><rect x="22" y="86" width="1000" height="66" rx="7" fill="#fff"/><text class="body" x="40" y="115">변경 사항은 상호 협의 후 서면으로 확정하며, 공사 완료 기한은</text><rect x="570" y="94" width="300" height="30" rx="4" fill="#fff8e6"/><text class="body" x="576" y="115">2026년 12월 20일까지</text><text x="22" y="174" font-size="13" font-weight="800" fill="#315bd8">이 문서에서 2건 더 보기</text><text class="h2" x="22" y="248">현장회의록_0907.docx</text><text class="small" x="22" y="274">회의록 · 4쪽 · 2회 일치</text><rect x="810" y="228" width="96" height="28" rx="14" fill="#edf6ff"/><text x="858" y="247" text-anchor="middle" font-size="12" font-weight="800" fill="#2169ac">의미</text><text x="930" y="247" font-size="13" font-weight="800" fill="#315bd8">유사도 84%</text><rect x="22" y="296" width="1000" height="66" rx="7" fill="#fff"/><text class="body" x="40" y="326">계약 변경안은 다음 회의에서 검토하고 완료 일정은 담당자 확인 후 확정한다.</text><text x="22" y="384" font-size="13" font-weight="800" fill="#315bd8">이 문서에서 1건 더 보기</text></g><g class="pin"><g transform="translate(18 245)"><circle r="18"/><text y="1">1</text></g><g transform="translate(280 104)"><circle r="18"/><text y="1">2</text></g><g transform="translate(280 202)"><circle r="18"/><text y="1">3</text></g><g transform="translate(280 282)"><circle r="18"/><text y="1">4</text></g><g transform="translate(1180 309)"><circle r="18"/><text y="1">5</text></g><g transform="translate(280 420)"><circle r="18"/><text y="1">6</text></g><g transform="translate(1352 492)"><circle r="18"/><text y="1">7</text></g></g></svg>