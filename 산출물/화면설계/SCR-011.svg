<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" role="img" aria-labelledby="title desc"><title id="title">SCR-011 문서 기반 질의응답</title><desc id="desc">프로젝트 화면 위에 열린 문서 챗봇 drawer 설계</desc><defs><style>@font-face{font-family:'Noto Sans KR';src:url('../포트폴리오/NotoSansKR.ttf') format('truetype');font-weight:100 900}text{font-family:'Noto Sans KR',Pretendard,'Malgun Gothic',sans-serif}.title{font-size:32px;font-weight:850;fill:#0f172a}.h2{font-size:21px;font-weight:800;fill:#0f172a}.body{font-size:15px;fill:#475569}.small{font-size:12px;fill:#64748b}.nav{font-size:16px;font-weight:700;fill:#cbd5e1}.pin circle{fill:#315bd8;stroke:#fff;stroke-width:4}.pin text{fill:#fff;font-size:19px;font-weight:800;text-anchor:middle;dominant-baseline:middle}</style></defs><rect width="1440" height="1024" fill="#f5f7fb"/><rect width="262" height="1024" fill="#0e162f"/><text x="32" y="48" font-size="28" font-weight="900" fill="#fff">Tasqra</text><text x="28" y="102" font-size="13" font-weight="800" fill="#9fb5ff">도로 정비 사업</text><g class="nav"><rect x="18" y="144" width="226" height="42" rx="9" fill="#315bd8" opacity=".25"/><text x="42" y="172" fill="#fff">▦  대시보드</text><text x="42" y="222">▤  문서</text><text x="42" y="272">⌕  검색</text><text x="42" y="322">▦  보드</text><text x="42" y="372">₩  금액</text><text x="42" y="422">▣  산출물</text><text x="42" y="472">⚙  설정</text></g><rect x="262" width="1178" height="64" fill="#fff"/><text x="296" y="41" font-size="17" fill="#64748b">워크스페이스  ›  도로 정비 사업  ›  대시보드</text><g opacity=".72"><text class="title" x="296" y="134">대시보드</text><g fill="#fff" stroke="#e2e8f0"><rect x="296" y="178" width="220" height="110" rx="14"/><rect x="536" y="178" width="220" height="110" rx="14"/><rect x="776" y="178" width="220" height="110" rx="14"/><rect x="296" y="314" width="700" height="274" rx="14"/><rect x="296" y="614" width="700" height="300" rx="14"/></g><g class="h2"><text x="322" y="222">전체 문서</text><text x="562" y="222">처리 중</text><text x="802" y="222">열린 태스크</text><text x="322" y="356">확인이 필요한 일</text><text x="322" y="656">프로젝트 캘린더</text></g></g><rect x="1018" y="64" width="422" height="960" fill="#fff" stroke="#cbd5e1"/><rect x="1018" y="64" width="422" height="84" fill="#16234a"/><text x="1050" y="101" font-size="22" font-weight="850" fill="#fff">문서 챗봇</text><text x="1050" y="127" font-size="13" fill="#cbd5e1">도로 정비 사업 문서를 기준으로 답합니다.</text><text x="1402" y="108" text-anchor="end" font-size="24" fill="#fff">×</text><g transform="translate(1040 174)"><rect width="350" height="90" rx="14" fill="#eef2ff"/><text class="body" x="18" y="34">공사 완료 기한과 변경 조건을</text><text class="body" x="18" y="62">정리해줘.</text><text class="small" x="330" y="80" text-anchor="end">나</text><rect y="114" width="350" height="230" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text class="body" x="18" y="150">공사 완료 기한은 2026년 12월 20일입니다.</text><text class="body" x="18" y="180">변경 사항은 상호 협의 후 서면으로</text><text class="body" x="18" y="210">확정하도록 계약서에 기재되어 있습니다.</text><text x="18" y="252" font-size="13" font-weight="800" fill="#315bd8">근거 문서와 원문 인용</text><rect x="18" y="272" width="314" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="32" y="294" font-size="13" font-weight="800" fill="#0f172a">공사계약서_최종.pdf</text><text x="32" y="313" font-size="11" fill="#64748b">4항·6항 원문으로 이동 →</text><rect y="370" width="350" height="86" rx="14" fill="#eef2ff"/><text class="body" x="18" y="404">관련 태스크도 알려줘.</text><text class="small" x="330" y="444" text-anchor="end">나</text><rect y="480" width="350" height="192" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text class="body" x="18" y="516">열린 태스크는 2건입니다.</text><text class="body" x="18" y="551">• 계약 변경안 검토</text><text class="body" x="18" y="582">• 공사 일정 담당자 확인</text><text x="18" y="630" font-size="13" font-weight="800" fill="#315bd8">근거 문서와 원문 인용</text></g><rect x="1040" y="878" width="350" height="92" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1058" y="912" font-size="15" fill="#94a3b8">프로젝트 문서에 질문하세요</text><text x="1058" y="950" font-size="11" fill="#64748b">Enter 전송 · Shift+Enter 줄바꿈</text><circle cx="1360" cy="936" r="22" fill="#315bd8"/><text x="1360" y="943" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">↑</text><g class="pin"><g transform="translate(1002 64)"><circle r="18"/><text y="1">1</text></g><g transform="translate(1025 174)"><circle r="18"/><text y="1">2</text></g><g transform="translate(1025 288)"><circle r="18"/><text y="1">3</text></g><g transform="translate(1025 560)"><circle r="18"/><text y="1">4</text></g><g transform="translate(1025 878)"><circle r="18"/><text y="1">5</text></g></g></svg>