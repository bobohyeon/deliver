<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" role="img" aria-labelledby="title desc"><title id="title">SCR-007 문서 상세와 원문</title><desc id="desc">문서 상세, 추출 텍스트, OCR 진입과 변경 이력 탭 화면 설계</desc><defs><style>@font-face{font-family:'Noto Sans KR';src:url('../포트폴리오/NotoSansKR.ttf') format('truetype');font-weight:100 900}text{font-family:'Noto Sans KR',Pretendard,'Malgun Gothic',sans-serif}.title{font-size:31px;font-weight:850;fill:#0f172a}.h2{font-size:21px;font-weight:800;fill:#0f172a}.body{font-size:16px;fill:#475569}.small{font-size:13px;fill:#64748b}.nav{font-size:16px;font-weight:700;fill:#cbd5e1}.pin circle{fill:#315bd8;stroke:#fff;stroke-width:4}.pin text{fill:#fff;font-size:19px;font-weight:800;text-anchor:middle;dominant-baseline:middle}</style></defs><rect width="1440" height="1024" fill="#f5f7fb"/><rect width="262" height="1024" fill="#0e162f"/><text x="32" y="48" font-size="28" font-weight="900" fill="#fff">Tasqra</text><text x="28" y="102" font-size="13" font-weight="800" fill="#9fb5ff">도로 정비 사업</text><g class="nav"><text x="42" y="172">▦  대시보드</text><rect x="18" y="194" width="226" height="42" rx="9" fill="#315bd8" opacity=".25"/><text x="42" y="222" fill="#fff">▤  문서</text><text x="42" y="272">⌕  검색</text><text x="42" y="322">▦  보드</text><text x="42" y="372">₩  금액</text><text x="42" y="422">▣  산출물</text><text x="42" y="472">⚙  설정</text></g><rect x="262" width="1178" height="64" fill="#fff"/><path d="M262 64H1440" stroke="#e2e8f0"/><text x="296" y="41" font-size="17" fill="#64748b">워크스페이스  ›  도로 정비 사업  ›  문서 상세</text><text x="296" y="108" font-size="16" font-weight="800" fill="#315bd8">← 문서 목록</text><text class="title" x="296" y="159">공사계약서_최종.pdf</text><text class="small" x="296" y="188">PDF · 12쪽 · 원문 18,420자</text><rect x="1150" y="118" width="132" height="42" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="1216" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">원본 다운로드</text><rect x="1292" y="118" width="104" height="42" rx="8" fill="#fff1f0" stroke="#fecaca"/><text x="1344" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#b42318">문서 삭제</text><g transform="translate(296 220)"><rect width="1100" height="60" rx="11" fill="#fff" stroke="#e2e8f0"/><rect x="12" y="10" width="160" height="40" rx="8" fill="#eef2ff"/><g font-size="16" font-weight="800"><text x="92" y="36" text-anchor="middle" fill="#315bd8">문서 내용</text><text x="270" y="36" text-anchor="middle" fill="#64748b">OCR 검수</text><text x="430" y="36" text-anchor="middle" fill="#64748b">분석 결과</text><text x="590" y="36" text-anchor="middle" fill="#64748b">변경 이력</text></g><text x="1000" y="36" font-size="14" fill="#237248">● 처리 완료</text></g><rect x="296" y="304" width="1100" height="646" rx="14" fill="#fff" stroke="#e2e8f0"/><text class="h2" x="326" y="350">추출 텍스트</text><rect x="1038" y="325" width="142" height="40" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="1109" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">전체 복사</text><rect x="1192" y="325" width="174" height="40" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="1279" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">문서 내용에서 검색</text><rect x="326" y="390" width="1040" height="514" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><g class="body"><text x="354" y="433" font-weight="800" fill="#0f172a">공 사 도 급 계 약 서</text><text x="354" y="477">본 계약은 도로 정비 사업의 시공 범위와 계약 금액, 공사 기간을 정함을 목적으로 한다.</text><text x="354" y="521">1. 공사명: 2026년 도로 정비 사업</text><text x="354" y="565">2. 공사 위치: 대상 구간 A 및 부대시설</text><text x="354" y="609">3. 계약 금액: 금 일억이천만원정</text><rect x="350" y="626" width="768" height="38" rx="5" fill="#fff8e6"/><text x="354" y="653">4. 공사 기간: 2026년 9월 15일부터 2026년 12월 20일까지</text><text x="354" y="697">5. 계약 당사자는 계약 조건과 설계도서에 따라 성실히 의무를 이행한다.</text><text x="354" y="741">6. 변경 사항은 상호 협의 후 서면으로 확정한다.</text><text x="354" y="785">이하 세부 조건은 첨부 내역서 및 특수 조건에 따른다.</text></g><g class="pin"><g transform="translate(18 195)"><circle r="18"/><text y="1">1</text></g><g transform="translate(280 102)"><circle r="18"/><text y="1">2</text></g><g transform="translate(280 145)"><circle r="18"/><text y="1">3</text></g><g transform="translate(1134 118)"><circle r="18"/><text y="1">4</text></g><g transform="translate(280 220)"><circle r="18"/><text y="1">5</text></g><g transform="translate(280 304)"><circle r="18"/><text y="1">6</text></g><g transform="translate(1022 325)"><circle r="18"/><text y="1">7</text></g></g></svg>