<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" role="img" aria-labelledby="title desc"><title id="title">SCR-005 프로젝트 대시보드</title><desc id="desc">프로젝트 핵심 현황 화면 설계</desc><defs><style>@font-face{font-family:'Noto Sans KR';src:url('../포트폴리오/NotoSansKR.ttf') format('truetype');font-weight:100 900}text{font-family:'Noto Sans KR',Pretendard,'Malgun Gothic',sans-serif}.title{font-size:34px;font-weight:850;fill:#0f172a}.h2{font-size:22px;font-weight:800;fill:#0f172a}.body{font-size:16px;fill:#475569}.small{font-size:13px;fill:#64748b}.nav{font-size:16px;font-weight:700;fill:#cbd5e1}.pin circle{fill:#315bd8;stroke:#fff;stroke-width:4}.pin text{fill:#fff;font-size:19px;font-weight:800;text-anchor:middle;dominant-baseline:middle}</style></defs><rect width="1440" height="1024" fill="#f5f7fb"/><rect width="262" height="1024" fill="#0e162f"/><text x="32" y="48" font-size="28" font-weight="900" fill="#fff">Tasqra</text><text x="28" y="102" font-size="13" font-weight="800" fill="#9fb5ff">전체 프로젝트</text><text x="28" y="150" font-size="14" font-weight="800" fill="#9fb5ff">도로 정비 사업</text><rect x="18" y="170" width="226" height="42" rx="9" fill="#315bd8" opacity=".25"/><g class="nav"><text x="42" y="198" fill="#fff">▦  대시보드</text><text x="42" y="248">▤  문서</text><text x="42" y="298">⌕  검색</text><text x="42" y="348">▦  보드</text><text x="42" y="398">₩  금액</text><text x="42" y="448">▣  산출물</text><text x="42" y="498">⚙  설정</text></g><rect x="262" width="1178" height="64" fill="#fff"/><path d="M262 64H1440" stroke="#e2e8f0"/><text x="296" y="41" font-size="17" fill="#64748b">워크스페이스  ›  도로 정비 사업  ›  대시보드</text><text x="1368" y="41" text-anchor="end" font-size="17" font-weight="700" fill="#334155">알림  ·  홍길동 ⌄</text><g transform="translate(296 104)"><text x="0" y="0" font-size="13" font-weight="900" letter-spacing="2" fill="#315bd8">PROJECT OVERVIEW</text><text class="title" x="0" y="43">대시보드</text><text class="body" x="0" y="73">지금 확인할 문서와 우선 처리할 액션