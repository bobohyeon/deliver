<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" role="img" aria-labelledby="title desc"><title id="title">SCR-003 회원가입</title><desc id="desc">Tasqra 회원가입 화면 설계</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e162f"/><stop offset="1" stop-color="#223672"/></linearGradient><style>@font-face{font-family:'Noto Sans KR';src:url('../포트폴리오/NotoSansKR.ttf') format('truetype');font-weight:100 900}text{font-family:'Noto Sans KR',Pretendard,'Malgun Gothic',sans-serif}.h1{font-size:47px;font-weight:800}.h2{font-size:38px;font-weight:800;fill:#0f172a}.body{font-size:20px}.label{font-size:17px;font-weight:700;fill:#334155}.pin circle{r:14px;fill:#315bd8;stroke:#fff;stroke-width:3}.pin text{fill:#fff;font-size:14px;font-weight:800;text-anchor:middle;dominant-baseline:middle}</style></defs><rect width="1440" height="1024" fill="#f5f7fb"/><rect width="665" height="1024" fill="url(#brand)"/><text x="70" y="72" font-size="32" font-weight="900" fill="#fff">Tasqra</text><text x="80" y="248" font-size="17" font-weight="900" letter-spacing="3" fill="#9fb5ff">DOCUMENT TO PROJECT</text><text class="h1" x="80" y="324" fill="#fff">문서의 맥락을 잃지 않고</text><text class="h1" x="80" y="390" fill="#fff">실행까지 연결하세요.</text><text class="body" x="80" y="456" fill="#cbd5e1">OCR 검수, AI 분석, 프로젝트 업무와 산출물을</text><text class="body" x="80" y="491" fill="#cbd5e1">하나의 흐름으로 관리합니다.</text><circle cx="333" cy="674" r="110" fill="#315bd8" opacity=".8"/><text x="333" y="702" text-anchor="middle" font-size="78" font-weight="900" fill="#fff">T</text><g font-size="18" font-weight="700" fill="#e2e8f0"><text x="80" y="886">✓  원문과 분석 근거 연결</text><text x="80" y="925">✓  프로젝트별 안전한 권한 관리</text><text x="80" y="964">✓  검토와 변경 이력 보존</text></g><rect x="790" y="72" width="536" height="880" rx="24" fill="#fff" stroke="#e2e8f0"/><text x="842" y="136" font-size="15" font-weight="900" letter-spacing="2" fill="#315bd8">WELCOME TO TASQRA</text><text class="h2" x="842" y="190">새 계정 만들기</text><text class="body" x="842" y="230" fill="#64748b">팀의 문서 업무를 정리할 계정을 만드세요.</text><g class="label"><text x="842" y="300">표시 이름</text><text x="842" y="424">아이디</text><text x="842" y="548">이메일</text><text x="842" y="672">비밀번호</text></g><g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="842" y="319" width="432" height="54" rx="9"/><rect x="842" y="443" width="432" height="54" rx="9"/><rect x="842" y="567" width="432" height="54" rx="9"/><rect x="842" y="691" width="432" height="54" rx="9"/></g><g font-size="17" fill="#94a3b8"><text x="864" y="353">이름을 입력하세요</text><text x="864" y="477">아이디를 입력하세요</text><text x="864" y="601">name@example.com</text><text x="864" y="725">8자 이상 입력하세요</text></g><rect x="842" y="790" width="432" height="58" rx="9" fill="#315bd8"/><text x="1058" y="827" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">계정 만들기</text><text x="932" y="897" font-size="18" fill="#64748b">이미 계정이 있으신가요?</text><text x="1160" y="897" font-size="18" font-weight="800" fill="#315bd8">로그인</text><g class="pin"><g transform="translate(28 28)"><circle r="18"/><text y="1">1</text></g><g transform="translate(46 214)"><circle r="18"/><text y="1">2</text></g><g transform="translate(774 122)"><circle r="18"/><text y="1">3</text></g><g transform="translate(826 286)"><circle r="18"/><text y="1">4</text></g><g transform="translate(826 776)"><circle r="18"/><text y="1">5</text></g><g transform="translate(895 884)"><circle r="18"/><text y="1">6</text></g></g></svg>