<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" role="img" aria-labelledby="title desc">
<title id="title">SCR-001 서비스 랜딩</title><desc id="desc">Tasqra 공개 랜딩 화면 설계</desc>
<defs><linearGradient id="hero" x1="0" x2="1"><stop stop-color="#16234a"/><stop offset="1" stop-color="#223672"/></linearGradient><style>@font-face{font-family:'Noto Sans KR';src:url('../포트폴리오/NotoSansKR.ttf') format('truetype');font-weight:100 900}text{font-family:'Noto Sans KR',Pretendard,'Malgun Gothic',sans-serif}.h1{font-size:58px;font-weight:800;fill:#0f172a}.h2{font-size:30px;font-weight:800;fill:#0f172a}.body{font-size:21px;fill:#475569}.small{font-size:17px;fill:#64748b}.nav{font-size:18px;font-weight:700;fill:#334155}.white{fill:#fff}.pin circle{fill:#16234a;stroke:#fff;stroke-width:4}.pin text{fill:#fff;font-size:19px;font-weight:800;text-anchor:middle;dominant-baseline:middle}</style></defs>
<rect width="1440" height="1024" fill="#f5f7fb"/><rect width="1440" height="76" fill="#fff"/><path d="M0 76H1440" stroke="#e2e8f0"/>
<text x="54" y="49" font-size="30" font-weight="900" fill="#16234a">Tasqra</text><text class="nav" x="930" y="47">기능 소개</text><text class="nav" x="1058" y="47">로그인</text><rect x="1163" y="17" width="216" height="44" rx="9" fill="#315bd8"/><text x="1271" y="46" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">무료로 시작하기</text>
<rect x="0" y="77" width="1440" height="552" fill="#fff"/><text x="92" y="169" font-size="16" font-weight="900" letter-spacing="3" fill="#315bd8">DOCUMENT INTELLIGENCE WORKSPACE</text><text class="h1" x="92" y="251">흩어진 문서를 한곳에</text><text class="h1" x="92" y="326">프로젝트를 한눈에</text><text class="body" x="92" y="388">AI가 문서의 핵심을 분석하고,</text><text class="body" x="92" y="423">프로젝트와 태스크로 전환해 실행까지 지원합니다.</text><rect x="92" y="466" width="224" height="58" rx="10" fill="#315bd8"/><text x="204" y="503" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">무료로 시작하기 →</text><rect x="332" y="466" width="190" height="58" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="427" y="503" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">작동 방식 보기</text>
