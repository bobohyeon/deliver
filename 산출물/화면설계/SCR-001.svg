<g transform="translate(70 665)"><text class="h2" x="0" y="0">Tasqra의 핵심 기능</text><g transform="translate(0 38)"><rect width="310" height="220" rx="16" fill="#fff" stroke="#e2e8f0"/><rect x="334" width="310" height="220" rx="16" fill="#fff" stroke="#e2e8f0"/><rect x="668" width="310" height="220" rx="16" fill="#fff" stroke="#e2e8f0"/><rect x="1002" width="310" height="220" rx="16" fill="#fff" stroke="#e2e8f0"/><g font-size="24" font-weight="800" fill="#0f172a"><text x="28" y="67">정확한 OCR</text><text x="362" y="67">AI 문서 분석</text><text x="696" y="67">프로젝트 자동 생성</text><text x="1030" y="67">협업 및 추적 관리</text></g><g class="body"><text x="28" y="112">다양한 형식의 문서를</text><text x="28" y="145">높은 정확도로 인식</text><text x="362" y="112">핵심 내용과 요구사항을</text><text x="362" y="145">자동으로 추출</text><text x="696" y="112">분석 결과를 프로젝트와</text><text x="696" y="145">태스크로 구성</text><text x="1030" y="112">진행 상황과 변경 이력을</text><text x="1030" y="145">한눈에 확인</text></g></g></g>
