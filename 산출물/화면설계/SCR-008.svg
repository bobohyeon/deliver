ont-size="15" font-weight="800" fill="#64748b">액션 태스크 후보</text><rect y="60" width="152" height="38" rx="8" fill="#eef2ff"/><text x="76" y="85" text-anchor="middle" font-size="14" font-weight="800" fill="#315bd8">승인 대기 3</text><text x="226" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">반영됨 2</text><text x="366" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">거절됨 1</text><g transform="translate(0 122)"><g fill="#f8fafc" stroke="#e2e8f0"><rect width="536" height="145" rx="10"/><rect y="161" width="536" height="145" rx="10"/><rect y="322" width="536" height="145" rx="10"/></g><g font-size="13" font-weight="800" fill="#315bd8"><text x="18" y="31">결정사항</text><text x="18" y="192">기한</text><text x="18" y="353">주요 시점</text></g><g class="body"><text x="18" y="64">변경 사항은 상호 협의 후 서면으로 확정한다.</text><text x="18" y="91">근거: 계약서 6항</text><text x="18" y="225">공사 완료 기한: 2026년 12월 20일</text><text x="18" y="252">근거: 계약서 4항</text><text x="18" y="386">공사 시작일: 2026년 9월 15일</text><text x="18" y="413">근거: 계약서 4항</text></g><g font-size="13" font-weight="800"><text x="392" y="122" fill="#237248">승인</text><text x="448" y="122" fill="#aa3445">거절</text><text x="392" y="283" fill="#237248">승인</text><text x="448" y="283" fill="#aa3445">거절</text><text x="392" y="444" fill="#237248">승인</text><text x="448" y="444" fill="#aa3445">거절</text></g></g></g><g class="pin"><g transform="translate(18 195)"><circle r="18"/><text y="1">1</text></g><g transform="translate(280 90)"><circle r="18"/><text y="1">2</text></g><g transform="translate(280 185)"><circle r="18"/><text y="1">3</text></g><g transform="translate(280 263)"><circle r="18"/><text y="1">4</text></g><g transform="translate(796 263)"><circle r="18"/><text y="1">5</text></g><g transform="translate(820 347)"><circle r="18"/><text y="1">6</text></g><g transform="translate(820 410)"><circle r="18"/><text y="1">7</text></g></g></svg>