<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" role="img" aria-labelledby="title desc"><title id="title">SCR-016 페이지 없음</title><desc id="desc">잘못된 경로 안내와 복귀 동작 화면 설계</desc><defs><style>@font-face{font-family:'Noto Sans KR';src:url('../포트폴리오/NotoSansKR.ttf') format('truetype');font-weight:100 900}text{font-family:'Noto Sans KR',Pretendard,'Malgun Gothic',sans-serif}.pin circle{r:14px;fill:#315bd8;stroke:#fff;stroke-width:3}.pin text{fill:#fff;font-size:14px;font-weight:800;text-anchor:middle;dominant-baseline:middle}</style></defs><rect width="1440" height="1024" fill="#f5f7fb"/><rect width="1440" height="76" fill="#fff"/><path d="M0 76H1440" stroke="#e2e8f0"/><text x="54" y="49" font-size="30" font-weight="900" fill="#16234a">Tasqra</text><text x="1260" y="47" text-anchor="end" font-size="18" font-weight="700" fill="#334155">내 프로젝트</text><text x="1368" y="47" text-anchor="end" font-size="18" font-weight="700" fill="#334155">홍길동 ⌄</text><circle cx="720" cy="354" r="128" fill="#eef2ff"/><text x="720" y="384" text-anchor="middle" font-size="96" font-weight="900" fill="#315bd8">404</text><text x="720" y="535" text-anchor="middle" font-size="42" font-weight="850" fill="#0f172a">페이지를 찾을 수 없습니다.</text><text x="720" y="584" text-anchor="middle" font-size="20" fill="#64748b">주소를 확인하거나 정상 화면으로 이동해 주세요.</text><rect x="470" y="648" width="232" height="58" rx="10" fill="#315bd8"/><text x="586" y="685" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">내 프로젝트로 이동</text><rect x="722" y="648" width="232" height="58" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="838" y="685" text-anchor="middle" font-size="19" font-weight="750" fill="#334155">홈으로 이동</text><g class="pin"><g transform="translate(20 20)"><circle r="18"/><text y="1">1</text></g><g transform="translate(572 330)"><circle r="18"/><text y="1">2</text></g><g transform="translate(450 648)"><circle r="18"/><text y="1">3</text></g></g></svg>