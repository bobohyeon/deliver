<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Tasqra 발표 Q&amp;A</title>
<!--
  이 파일의 책임 : Tasqra 최종 발표(김보현 1~21번)의 예상 질문과 답변을 폰에서 보는 단일 화면 앱.
  다른 파일과의 관계 : 산출물/최종발표 의 발표 대본·구성표에 적힌 사실만 답변으로 옮겨 적었다.
                       외부 CSS·JS·폰트를 쓰지 않으므로 파일 하나만 열면 인터넷 없이 동작한다.
  Spring 비교        : 서버 렌더링 없이 화면과 데이터를 한 파일에 담았다. Thymeleaf 템플릿 + 컨트롤러 +
                       DB 대신, QA 배열이 데이터이고 localStorage 가 사용자별 진도 저장소 역할을 한다.
-->
<style>
  :root{
    --ink:#111111; --ink2:#3d3d3d; --ink3:#6b6b6b;
    --line:#d8d8d8; --line2:#ebebeb; --bg:#ffffff; --bg2:#f5f5f5; --bg3:#fafafa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:16px; line-height:1.65; -webkit-text-size-adjust:100%;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--line); padding:14px 16px 10px;
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .brand{display:flex; align-items:baseline; gap:8px}
  .brand h1{margin:0; font-size:18px; font-weight:800; letter-spacing:-.2px}
  .brand span{font-size:12px; font-weight:700; color:var(--ink3)}
  .bar{margin-top:10px; height:6px; background:var(--bg2); border-radius:3px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:var(--ink); transition:width .2s}
  .barnote{margin-top:6px; font-size:12px; color:var(--ink3); display:flex; justify-content:space-between}
  .barnote b{color:var(--ink)}
  .search{margin-top:10px; position:relative}
  .search input{
    width:100%; padding:12px 40px 12px 14px; font-size:16px; color:var(--ink);
    background:var(--bg3); border:1px solid var(--line); border-radius:12px; outline:none;
    font-family:inherit;
  }
  .search input:focus{border-color:var(--ink); background:var(--bg)}
  .search button{
    position:absolute; right:6px; top:6px; width:32px; height:32px; border:0; border-radius:8px;
    background:transparent; color:var(--ink3); font-size:18px; font-weight:700; line-height:1; cursor:pointer;
  }
  .chips{display:flex; gap:6px; overflow-x:auto; padding:10px 16px 12px; border-bottom:1px solid var(--line2);
         -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; padding:8px 13px; font-size:13px; font-weight:700; color:var(--ink2);
    background:var(--bg2); border:1px solid transparent; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--ink); color:#fff}
  .chip em{font-style:normal; font-weight:700; opacity:.6; margin-left:4px}
  .tools{display:flex; gap:8px; padding:12px 16px 4px}
  .tools button{
    flex:1; padding:11px 8px; font-size:13px; font-weight:700; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:10px; cursor:pointer; font-family:inherit;
  }
  .tools button:active{background:var(--bg2)}
  main{padding:12px 16px 0}
  .count{font-size:12px; color:var(--ink3); padding:4px 0 10px}
  .card{border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; background:var(--bg)}
  .card.on{border-color:var(--ink)}
  .card.done{background:var(--bg3)}
  .q{display:flex; gap:10px; align-items:flex-start; padding:14px; cursor:pointer}
  .no{
    flex:0 0 auto; min-width:30px; height:24px; padding:0 6px; border-radius:6px; background:var(--bg2);
    color:var(--ink2); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .card.key .no{background:var(--ink); color:#fff}
  .qt{flex:1; font-size:15px; font-weight:700; line-height:1.55; letter-spacing:-.2px}
  .meta{margin-top:6px; font-size:11px; font-weight:700; color:var(--ink3)}
  .meta .k{color:var(--ink); border:1px solid var(--ink); border-radius:4px; padding:1px 5px; margin-left:6px}
  .caret{flex:0 0 auto; color:var(--ink3); font-size:13px; font-weight:800; margin-top:2px; transition:transform .18s}
  .card.on .caret{transform:rotate(90deg)}
  .a{display:none; padding:0 14px 14px; border-top:1px solid var(--line2)}
  .card.on .a{display:block}
  .a p{margin:12px 0 0; font-size:15px; color:var(--ink2); line-height:1.75}
  .a .tag{margin-top:12px; font-size:11px; font-weight:800; color:var(--ink3); letter-spacing:.4px}
  .a ul{margin:8px 0 0; padding-left:18px}
  .a li{font-size:14px; color:var(--ink2); margin:4px 0}
  .a .warn{margin-top:12px; padding:10px 12px; background:var(--bg2); border-left:3px solid var(--ink); font-size:13px; color:var(--ink)}
  .a .act{display:flex; gap:8px; margin-top:14px}
  .a .act button{
    flex:1; padding:10px; font-size:13px; font-weight:800; border-radius:9px; cursor:pointer; font-family:inherit;
    background:var(--bg); color:var(--ink); border:1px solid var(--line);
  }
  .a .act button.mark[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
  .empty{padding:40px 8px; text-align:center; color:var(--ink3); font-size:14px}
  footer{
    position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--bg);
    border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:8px;
  }
  footer button{
    flex:1; padding:13px 8px; font-size:14px; font-weight:800; border-radius:11px; cursor:pointer; font-family:inherit;
    background:var(--ink); color:#fff; border:1px solid var(--ink);
  }
  footer button.ghost{background:var(--bg); color:var(--ink); border-color:var(--line)}
  mark{background:#e4e4e4; color:var(--ink); padding:0 1px; border-radius:2px}
  @media (min-width:720px){
    body{max-width:820px; margin:0 auto; border-left:1px solid var(--line2); border-right:1px solid var(--line2)}
    footer{max-width:820px; left:50%; transform:translateX(-50%)}
    .qt{font-size:16px}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Tasqra 발표 Q&amp;A</h1>
    <span id="brandNote">김보현 1~21번</span>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="barnote">
    <span>외운 문항 <b id="doneNum">0</b> / <span id="totalNum">0</span></span>
    <span id="pct">0%</span>
  </div>
  <div class="search">
    <input id="q" type="search" inputmode="search" placeholder="질문·답변 검색 (예: RRF, 98.1, 확정본)" autocomplete="off">
    <button id="clear" type="button" aria-label="검색 지우기">×</button>
  </div>
</header>

<nav class="chips" id="chips"></nav>

<div class="tools">
  <button id="openAll" type="button">전체 펼치기</button>
  <button id="closeAll" type="button">전체 접기</button>
  <button id="onlyLeft" type="button">안 외운 것만</button>
</div>

<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>

<footer>
  <button id="random" type="button">무작위 질문 연습</button>
  <button id="reset" class="ghost" type="button">진도 초기화</button>
</footer>

<script>
/* 발표 자료(대본·구성표·슬라이드)에 적힌 사실만 답변으로 옮겼다.
   측정하지 않은 것은 "아직 없다"고 그대로 적는다. cat = 분류, key = 우선 준비 문항 */
const QA = [
/* 1. 기획 */
{n:1,cat:"기획",key:1,q:"왜 여러 분야 중 공공 SI·용역 프로젝트를 대상으로 선정했나요?",
a:["처음에는 공개된 문서가 많아 학습·검증 데이터를 확보하기 쉬울 것이라고 판단해 선택했습니다.",
"진행하면서 이 분야가 서비스 문제에도 잘 맞는다는 것을 확인했습니다. 발주·계약·과업·보고 문서의 정보가 서로 이어지고, 기한·금액·계약 이행 의무처럼 중요한 정보는 원문 근거와 사람 확인이 필요했습니다."],
warn:"가설(데이터 접근성)로 시작해 실제 업무 문제를 확인했다는 순서로 답한다."},

{n:2,cat:"기획",q:"공공 문서가 많은데 데이터가 부족했다는 것은 무슨 뜻인가요?",
a:["원문이 많다는 것과 정답이 표시된 학습·평가 자료가 충분하다는 것은 다릅니다.",
"문서는 많았지만 모델 결과가 맞는지 판단할 정답 표본이 부족해, 평가 기준과 질문·정답 세트를 직접 만들어야 했습니다."]},

{n:3,cat:"기획",key:1,q:"기존 문서관리시스템이나 그룹웨어와 무엇이 다른가요?",
a:["문서를 저장하고 찾는 것에서 끝나지 않습니다. 문서에서 결정사항·일정·금액·계약 이행 태스크 후보를 뽑아 검토 대기로 저장하고, 사람이 승인한 정보만 태스크·대시보드·산출물로 연결합니다.",
"검색 결과도 문서명·페이지·원문 위치를 함께 제공해 판단 근거를 되짚을 수 있습니다."]},

{n:4,cat:"기획",q:"이 서비스가 해결하려는 가장 중요한 문제는 무엇인가요?",
a:["문서 안에 있는 정보가 실제 업무 실행으로 이어지지 않는 문제입니다.",
"기한·금액·의무처럼 실행이 필요한 정보를 근거와 함께 찾아내고, 사람 확인을 거쳐 태스크와 산출물로 연결하는 경계를 설계했습니다."]},

{n:5,cat:"기획",key:1,q:"왜 AI 결과를 자동 반영하지 않고 사람이 승인하게 했나요?",
a:["기한·금액·계약 의무는 틀렸을 때 업무에 직접 손해가 생기는 정보입니다.",
"그래서 모든 AI 제안은 검토 대기로 저장하고, 승인된 정보만 소비되게 했습니다. 인공지능 제안 → 사람 확인 → 승인 정보 반영이 모든 기능의 공통 원칙입니다."]},

{n:6,cat:"기획",q:"사람이 다 검토해야 하면 효율이 크게 좋아지지 않는 것 아닌가요?",
a:["사람의 작업을 없애는 것이 목표가 아니라, 찾는 일과 판단하는 일을 나눈 것입니다.",
"문서를 읽고 후보를 찾는 부분은 자동으로 처리하고, 사람은 제시된 후보를 확인·수정·거절만 하면 됩니다. 근거로 문서명·페이지·원문 위치를 함께 주기 때문에 확인 시간이 줄어듭니다."]},

{n:7,cat:"기획",q:"실제 사용자는 누구인가요?",
a:["프로젝트 문서를 근거로 업무를 확인해야 하는 프로젝트 담당자와 실무자를 기준으로 설계했습니다.",
"권한은 프로젝트 단위로 나뉘며, 소유자와 구성원 역할에 따라 접근 범위가 달라집니다."]},

{n:8,cat:"기획",q:"공공 SI가 아닌 일반 기업 프로젝트에도 쓸 수 있나요?",
a:["구조 자체는 문서 종류에 종속되지 않습니다. 문서에서 근거를 찾고 검토 후 반영하는 흐름은 그대로 적용할 수 있습니다.",
"다만 계약 이행 후보 탐색처럼 계약·변경계약 문서 형태를 전제로 만든 규칙은 대상 문서에 맞게 다시 정의해야 합니다."]},

/* 2. 아키텍처 */
{n:9,cat:"아키텍처",key:1,q:"바로 처리하는 요청과 Redis·Celery 작업으로 나눈 기준은 무엇인가요?",
a:["사용자가 결과를 즉시 기다릴 수 있는 작업인지가 기준입니다.",
"화면 조회·저장처럼 바로 끝나는 요청은 FastAPI가 SQLAlchemy를 거쳐 PostgreSQL에서 처리합니다. OCR·문서 나누기·AI 분석처럼 오래 걸리는 작업은 Redis 대기열에 등록하고 Celery Worker가 이어서 처리합니다."]},

{n:10,cat:"아키텍처",key:1,q:"OCR이나 AI 분석을 FastAPI에서 바로 실행하면 어떤 문제가 생기나요?",
a:["OCR은 문서에 따라 페이지당 십수 초가 걸릴 수 있고 AI 분석은 더 깁니다. 이를 요청 처리 안에서 실행하면 그동안 화면 응답이 묶이고, 요청이 끊기면 진행 중이던 작업도 함께 사라집니다.",
"작업을 대기열로 분리하면 화면은 즉시 응답하고, 작업은 Worker가 자기 속도로 처리합니다."]},

{n:11,cat:"아키텍처",q:"Redis 없이 Celery Worker만 쓸 수는 없나요?",
a:["Celery는 작업을 담아둘 전달자가 필요합니다. Redis가 그 대기열 역할을 합니다.",
"대기열을 프로세스 메모리에 두면 API나 Worker가 재기동될 때 대기 중이던 작업이 사라집니다. 외부 대기열에 두면 Worker가 종료되어도 작업이 남습니다."]},

{n:12,cat:"아키텍처",key:1,q:"Worker가 작업 도중 종료되면 진행 중이던 작업은 어떻게 되나요?",
a:["작업 완료 확인을 늦게 확정하기 때문에, Worker가 중단되면 해당 작업은 대기열에 남아 다시 처리됩니다.",
"실패가 반복될 때는 재시도 간격을 늘려가며 추가로 시도합니다. 이미 성공한 앞 단계는 다시 실행하지 않습니다."]},

{n:13,cat:"아키텍처",q:"같은 문서에 같은 작업이 중복 실행되는 문제는 어떻게 막았나요?",
a:["AI 분석은 같은 문서에 활성 작업이 이미 있으면 새 작업을 만들지 않도록 했습니다.",
"또 작업 시작 시점의 원문 버전과 해시를 저장하고 종료 시점에 다시 확인해, 그 사이 원문이 바뀐 결과가 저장되지 않게 했습니다."]},

{n:14,cat:"아키텍처",q:"API와 Worker가 같은 데이터·파일을 쓰는 구조가 안전한가요?",
a:["두 프로세스가 같은 PostgreSQL과 같은 문서 경로를 사용합니다. 그래서 어느 쪽이 재기동되어도 같은 기준으로 데이터를 다시 조회할 수 있습니다.",
"쓰기 충돌은 데이터베이스 트랜잭션과 상태값으로 통제하고, 문서 파일은 저장 후 경로만 참조하는 방식으로 다룹니다."]},

{n:15,cat:"아키텍처",q:"파일을 공유 경로에 저장했는데, 서버를 여러 대로 늘릴 때는 어떻게 하나요?",
a:["현재는 API와 Worker가 함께 보는 문서 경로에 저장하고 데이터베이스에는 위치와 메타데이터만 보관합니다.",
"여러 서버로 확장할 때는 이 경로를 공유 스토리지나 오브젝트 스토리지로 바꾸면 됩니다. 코드가 참조하는 것은 경로이므로 저장 위치를 교체하는 형태로 대응할 수 있습니다."]},

{n:16,cat:"아키텍처",q:"PostgreSQL과 pgvector를 한 데이터베이스에서 쓴 이유는 무엇인가요?",
a:["검색 결과는 항상 프로젝트·문서·권한과 함께 확인해야 합니다. 벡터와 업무 데이터가 같은 데이터베이스에 있으면 권한 조건을 포함해 한 번에 조회하고 같은 트랜잭션으로 다룰 수 있습니다.",
"의미 검색 벡터는 1024차원으로 저장합니다."]},

{n:17,cat:"아키텍처",q:"별도의 벡터 데이터베이스를 쓰지 않은 이유는 무엇인가요?",
a:["구성 요소를 하나 더 늘리면 권한 검증과 데이터 정합성을 두 저장소에 나눠 관리해야 합니다.",
"현재 문서 규모에서는 pgvector로 필요한 검색을 처리할 수 있었고, 업무 데이터와 함께 조회하는 이점이 더 컸습니다."]},

"후보를 더 넓히는 장치가 아니라 1등을 바로 고르게 만드는 장치라는 설명과 개선 방향이 일치합니다."]},

{n:117,cat:"검색 모델 학습",q:"학습으로 얻은 것과 잃은 것은 무엇인가요?",
a:["첫 결과 정답률 90%를 유지할 수 있는 문서 범위가 9건에서 약 15건으로, 청크 기준 400개에서 700개로 넓어졌습니다.",
"대신 학습 쌍이 400개에서 1,200개로 늘어 학습 시간이 28분에서 2시간 26분이 됐습니다."]},

{n:118,cat:"검색 모델 학습",q:"학습 설정은 어떻게 정했나요?",
a:["BGE-m3-ko에 LoRA를 적용해 36에포크로 학습했습니다.",
"48에포크는 성능이 꺾여서 36으로 확정했습니다."]},

{n:119,cat:"검색 모델 학습",key:1,q:"성능이 오른 이유가 정확히 무엇인가요?",
a:["대조 실험 결과, 효과를 만든 것은 오답을 같은 문서에서 뽑았다는 사실이었습니다.",
"가장 헷갈리는 것을 골랐기 때문은 아니었습니다. 즉 난이도 선별보다 오답을 어디서 가져오는지가 중요했습니다."],
warn:"이 장의 결론이다. '어려운 오답을 골라서 좋아졌다'고 말하지 않는다."},

{n:120,cat:"검색 모델 학습",key:1,q:"19·20·21번 실험은 같은 평가셋인가요?",
a:["**20번과 21번은 같은 평가셋입니다.** 문서 30건, 청크 1,339개, 질의 214개로 세현님이 측정했습니다. 그래서 학습 결과와 후보 범위별 성능을 이어서 말할 수 있습니다.",
"**19번만 다릅니다.** 임베딩 모델 선택은 제가 문서 10건, 조각 649개, 질문 133개로 따로 측정했고 청킹 방식도 다릅니다.",
"그래서 19번 수치는 20·21번과 이어 붙이지 않습니다."],
warn:"평가셋이 갈리는 지점은 19번과 20번 사이다. 이 구분을 먼저 말한다."},
];

const CATS = ["기획","아키텍처","데이터·상태","OCR","색인","검색","평가","질의응답","검토·태스크","금액","대시보드","모델","검색 모델 학습"];
const KEY_STORE = "tasqra-qna-done-v1";

let done = new Set();
try{ done = new Set(JSON.parse(localStorage.getItem(KEY_STORE) || "[]")); }catch(e){ done = new Set(); }

let filter = "전체";
let onlyLeft = false;
let term = "";

const $ = id => document.getElementById(id);
const listEl = $("list"), countEl = $("count"), chipsEl = $("chips");

function save(){
  try{ localStorage.setItem(KEY_STORE, JSON.stringify([...done])); }catch(e){}
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hl(s){
  const t = esc(s);
  if(!term) return t;
  try{ return t.replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"), m => "<mark>"+m+"</mark>"); }
  catch(e){ return t; }
}
function matches(item){
  if(filter === "핵심" && !item.key) return false;
  if(filter !== "전체" && filter !== "핵심" && item.cat !== filter) return false;
  if(onlyLeft && done.has(item.n)) return false;
  if(!term) return true;
  const hay = (item.q + " " + item.a.join(" ") + " " + (item.warn||"") + " " + item.cat).toLowerCase();
  return hay.includes(term.toLowerCase());
}

function buildChips(){
  const counts = {전체:QA.length, 핵심:QA.filter(x=>x.key).length};
  CATS.forEach(c => counts[c] = QA.filter(x=>x.cat===c).length);
  chipsEl.innerHTML = ["전체","핵심",...CATS].map(c =>
    `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c===filter}">${esc(c)}<em>${counts[c]}</em></button>`
  ).join("");
  chipsEl.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.cat; buildChips(); render(); window.scrollTo({top:0,behavior:"smooth"});
  }));
}

function render(){
  const rows = QA.filter(matches);
  countEl.textContent = `${rows.length}문항 표시` + (filter!=="전체" ? ` · ${filter}` : "") + (onlyLeft ? " · 안 외운 것만" : "");
  if(!rows.length){
    listEl.innerHTML = `<div class="empty">조건에 맞는 질문이 없습니다.<br>검색어나 분류를 바꿔 보세요.</div>`;
    return;
  }
  listEl.innerHTML = rows.map(item => {
    const isDone = done.has(item.n);
    return `
<article class="card${item.key?" key":""}${isDone?" done":""}" data-n="${item.n}">
  <div class="q" role="button" tabindex="0" aria-expanded="false">
    <span class="no">${item.n}</span>
    <div class="qt">${hl(item.q)}
      <div class="meta">${esc(item.cat)}${item.key?'<span class="k">핵심</span>':""}${isDone?'<span class="k">외웠음</span>':""}</div>
    </div>
    <span class="caret">›</span>
  </div>
  <div class="a">
    <div class="tag">이렇게 답한다</div>
    ${item.a.map(p=>`<p>${hl(p)}</p>`).join("")}
    ${item.warn?`<div class="warn">주의 · ${hl(item.warn)}</div>`:""}
    <div class="act">
      <button class="mark" type="button" aria-pressed="${isDone}">${isDone?"외웠음 해제":"외웠음 표시"}</button>
      <button class="fold" type="button">접기</button>
    </div>
  </div>
</article>`;
  }).join("");

  listEl.querySelectorAll(".card").forEach(card => {
    const head = card.querySelector(".q");
    const toggle = () => {
      const on = card.classList.toggle("on");
      head.setAttribute("aria-expanded", on ? "true" : "false");
    };
    head.addEventListener("click", toggle);
    head.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
    card.querySelector(".fold").addEventListener("click", () => {
      card.classList.remove("on");
      head.setAttribute("aria-expanded","false");
      card.scrollIntoView({block:"nearest"});
    });
    card.querySelector(".mark").addEventListener("click", () => {
      const n = Number(card.dataset.n);
      done.has(n) ? done.delete(n) : done.add(n);
      save(); progress(); render();
    });
  });
}

function progress(){
  const total = QA.length, d = QA.filter(x=>done.has(x.n)).length;
  const pct = total ? Math.round(d/total*100) : 0;
  $("totalNum").textContent = total;
  $("doneNum").textContent = d;
  $("pct").textContent = pct + "%";
  $("barFill").style.width = pct + "%";
}

$("q").addEventListener("input", e => { term = e.target.value.trim(); render(); });
$("clear").addEventListener("click", () => { $("q").value=""; term=""; render(); $("q").focus(); });
$("openAll").addEventListener("click", () => listEl.querySelectorAll(".card").forEach(c => {
  c.classList.add("on"); c.querySelector(".q").setAttribute("aria-expanded","true");
}));
$("closeAll").addEventListener("click", () => listEl.querySelectorAll(".card").forEach(c => {
  c.classList.remove("on"); c.querySelector(".q").setAttribute("aria-expanded","false");
}));
$("onlyLeft").addEventListener("click", () => {
  onlyLeft = !onlyLeft;
  $("onlyLeft").textContent = onlyLeft ? "전체 보기" : "안 외운 것만";
  render();
});
$("random").addEventListener("click", () => {
  const pool = QA.filter(matches);
  if(!pool.length) return;
  const pick = pool[Math.floor(Math.random()*pool.length)];
  const card = listEl.querySelector(`.card[data-n="${pick.n}"]`);
  if(!card) return;
  listEl.querySelectorAll(".card").forEach(c => { c.classList.remove("on"); c.querySelector(".q").setAttribute("aria-expanded","false"); });
  card.scrollIntoView({block:"center",behavior:"smooth"});
  card.animate?.([{opacity:.35},{opacity:1}],{duration:420});
});
$("reset").addEventListener("click", () => {
  if(!confirm("외운 표시를 모두 지웁니다. 계속할까요?")) return;
  done.clear(); save(); progress(); render();
});

buildChips(); progress(); render();
</script>
</body>
</html>
